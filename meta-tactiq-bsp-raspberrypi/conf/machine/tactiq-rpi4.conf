#@TYPE: Machine
#@NAME: TactiQ Raspberry Pi 4
#@DESCRIPTION: TactiQ OS on Raspberry Pi 4 Model B (BCM2711, Cortex-A72)
#
# Stage 3 of the track "own root, own board": the signed FIT through U-Boot,
# a dm-verity root, SELinux and RAUC A/B, without a TPM. No measured boot and
# no attestation quote on this machine until the TPM stage.
#
# Board-specific machine config. The Raspberry Pi side (VideoCore firmware,
# config.txt, CPU tune) comes from meta-raspberrypi's raspberrypi4-64.conf;
# ARM64 + U-Boot common settings from tactiq-arm64-uboot-base.inc. Values
# that both define are assigned again below with "=", so the TactiQ choice
# holds whatever the include order.
#
# Boot path: VideoCore firmware (from the FAT partition, not measured, not
# verified) -> u-boot.bin, installed as kernel8.img -> boot_ab -> bootm on the
# signed FIT of the slot. U-Boot uses its own control devicetree, with the FIT
# key in it, not the one the firmware passes; see u-boot-tactiq-rpi_2026.10.bb.
#
# Usage:
#   scripts/init-build.sh <layers-dir> <build-dir> rpi4
#   bitbake tactiq-image

require conf/machine/raspberrypi4-64.conf
require conf/machine/include/tactiq-arm64-uboot-base.inc

MACHINEOVERRIDES =. "tactiq-arm64:tactiq-rpi4:"

# ---- Kernel: linux-yocto, as on the Rockchip boards ----
# meta-raspberrypi defaults to linux-raspberrypi. linux-yocto keeps the
# kernel fragments of the common layer (security, verity, IMA keyring,
# lockup, pstore) and the module signing key on this board without copies.
# Mainline carries the Pi 4 devicetree.
PREFERRED_PROVIDER_virtual/kernel = "linux-yocto"
KBUILD_DEFCONFIG = "defconfig"
KCONFIG_MODE = "alldefconfig"
KERNEL_IMAGETYPE = "Image"
KERNEL_DEVICETREE = "broadcom/bcm2711-rpi-4-b.dtb"

# ---- Bootloader ----
PREFERRED_PROVIDER_virtual/bootloader = "u-boot-tactiq-rpi"
UBOOT_MACHINE = "rpi_4_defconfig"

# Kernel load address for a FIT kernel. oe-core's default 0x20008000 is not
# 2 MiB aligned, as the arm64 boot protocol requires. Same value as the
# RK3588 boards: the FIT itself is loaded at kernel_addr_r 0x02000000
# (tactiq-boot-fit.env), and bootm copies the kernel to 0x08000000, below
# fdt_addr_r 0x12000000. All three sit in the low ARM memory of the Pi 4.
UBOOT_ENTRYPOINT = "0x08000000"
UBOOT_LOADADDRESS = "${UBOOT_ENTRYPOINT}"

# ---- FIT boot: per-slot devicetrees carry the kernel command line ----
# As in tactiq-rockchip-rk3588.inc.
PREFERRED_PROVIDER_virtual/dtb ?= "tactiq-slot-dtb"
FIT_CONF_DEFAULT_DTB ?= "${@os.path.basename(d.getVar('KERNEL_DEVICETREE').split()[0])}"

# ---- Root devices in the dm-verity table (tactiq-slot-dtb.bb) ----
# Partitions: p1 firmware (vfat), p2 boot_a, p3 rootfs_a, p4 boot_b,
# p5 rootfs_b, p6 data (tactiq-ab-rpi.wks.in). By label, not /dev/mmcblkNpM:
# the mainline Pi 4 devicetree has no mmc aliases, so whether the SD card is
# mmcblk0 or mmcblk1 depends on probe order against the Wi-Fi SDIO
# controller. dm-mod.create resolves PARTLABEL= at boot through
# early_lookup_bdev. A partition with the same label on another disk cannot
# pass for the slot: the root hash in the signed devicetree still has to
# match.
TACTIQ_SLOT_A_DEV = "PARTLABEL=rootfs_a"
TACTIQ_SLOT_B_DEV = "PARTLABEL=rootfs_b"
# The SD card is found by an asynchronous rescan and may not be there yet
# when dm-init runs at late_initcall. dm-mod.waitfor makes dm-init poll for
# both labels (early_lookup_bdev in drivers/md/dm-init.c) before it builds
# the table; both partitions always exist on the card.
TACTIQ_DM_WAITFOR = "dm-mod.waitfor=PARTLABEL=rootfs_a,PARTLABEL=rootfs_b"

# ---- Serial console ----
# GPIO14/15 (header pins 8 and 10) carry uart1, the mini UART, and the
# devicetree aliases it as serial1, so Linux names it ttyS1. 115200 baud.
# enable_uart=1 in config.txt fixes the core clock the mini UART runs from.
SERIAL_CONSOLES = "115200;ttyS1"
ENABLE_UART = "1"
# Same as the default in tactiq-slot-dtb.bb except the console and the
# dm-mod.waitfor above. systemd.machine_id=firmware finds no /vm,uuid here
# (that comes from a Rockchip U-Boot patch), so the machine-id is random per
# boot, as on the Rock 5T in its stage 1.
TACTIQ_COMMON_BOOTARGS = "ro rootwait rootfstype=ext4 earlycon panic=5 console=tty1 console=ttyS1,115200 systemd.machine_id=firmware ${TACTIQ_DM_WAITFOR}"
UBOOT_EXTLINUX_CONSOLE = "console=tty1 console=ttyS1,115200"
UBOOT_EXTLINUX_KERNEL_ARGS:append = " rauc.slot=__RAUC_SLOT__"

# ---- Firmware partition ----
# VideoCore firmware and config.txt from meta-raspberrypi, and U-Boot under
# the name the firmware loads in 64-bit mode. No kernel, devicetree or
# overlay here: the kernel and its devicetrees are in the signed FIT on
# boot_a/boot_b.
IMAGE_BOOT_FILES = "${BOOTFILES_DIR_NAME}/* u-boot.bin;kernel8.img"
RPI_EXTRA_CONFIG = "arm_64bit=1\nkernel=kernel8.img\n"
DISABLE_VC4GRAPHICS = "1"

# ---- Image layout ----
WKS_FILE = "tactiq-ab-rpi.wks.in"

# ---- Features ----
# tpm2 builds kernel and userspace TPM support, as on the Rock 5T; it says
# nothing about a chip being present (docs/machines/README.md).
MACHINE_FEATURES = "tpm2 usbhost ext2 ext3 ext4 vfat"
# meta-raspberrypi appends its board defaults (Wi-Fi, Bluetooth, sound,
# graphics, touchscreen) to MACHINE_FEATURES_DEFAULTS; opt out of them.
MACHINE_FEATURES_OPTED_OUT:append = " apm keyboard screen touchscreen alsa bluetooth wifi sdio vc4graphics"
# meta-raspberrypi recommends every kernel module and the Wi-Fi/BT firmware.
MACHINE_EXTRA_RRECOMMENDS = ""

COMPATIBLE_MACHINE:tactiq-rpi4 = "tactiq-rpi4"

# meta-tactiq-bsp-raspberrypi layer configuration
#
# Vendor BSP layer for the Raspberry Pi 4 Model B (BCM2711) in TactiQ OS.
# Contains the machine config (tactiq-rpi4), the U-Boot recipe built from
# the same v2026.10 source as the Rockchip one, the Pi wic template and the
# Pi side of the A/B boot environment.
#
# Architecture: like meta-tactiq-bsp-rockchip, this layer depends on the
# vendor-agnostic base in meta-tactiq (conf/machine/include/
# tactiq-arm64-uboot-base.inc) and on meta-raspberrypi for the VideoCore
# firmware (rpi-bootfiles) and config.txt (rpi-config). It does not depend
# on meta-tactiq-bsp-rockchip and is not wired into the same build as it.
#
# A few files are copies of files in meta-tactiq-bsp-rockchip, because both
# BSP layers need them and the common layer does not carry them yet. The
# copies are byte-identical and tests/bsp/test_bsp_shared_files.py fails
# when they drift apart. Moving them into the common layer is a separate
# step, made together with a Rock 5A before/after comparison.

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "tactiq-bsp-raspberrypi"
BBFILE_PATTERN_tactiq-bsp-raspberrypi = "^${LAYERDIR}/"
BBFILE_PRIORITY_tactiq-bsp-raspberrypi = "6"

LAYERDEPENDS_tactiq-bsp-raspberrypi = "core meta-tactiq raspberrypi"
LAYERSERIES_COMPAT_tactiq-bsp-raspberrypi = "wrynose"

# wic templates: oe-core WKS_SEARCH_PATH scans ${BBPATH}/files/wic/, so
# tactiq-ab-rpi.wks.in lives in files/wic/ of this layer.

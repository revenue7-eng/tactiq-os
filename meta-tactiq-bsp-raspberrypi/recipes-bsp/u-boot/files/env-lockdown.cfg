# Only variables with an explicit 'w' flag survive import from the saved
# environment. Verified on board: bootcmd written to MMC via saveenv is
# discarded on reload, the built-in value stands; BOOT_ORDER (flagged w)
# is imported. Selects ENV_APPEND, so the built-in environment is never
# dropped. Note the Kconfig help overpromises: the access check in
# env_flags_validate() is gated on H_EXTERNAL, which only storage drivers
# set, so this does NOT restrict setenv from the U-Boot console.
CONFIG_ENV_WRITEABLE_LIST=y
# Block 'env set -f' from overriding the access flags.
CONFIG_ENV_ACCESS_IGNORE_FORCE=y
# Provides the 'env flags' subcommand for inspecting the static list.
CONFIG_CMD_ENV_FLAGS=y

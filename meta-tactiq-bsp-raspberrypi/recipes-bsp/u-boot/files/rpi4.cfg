# Raspberry Pi 4 (tactiq-rpi4), stage 3: signed FIT, no TPM, no measured boot.
#
# Control devicetree. On BCM283x U-Boot normally takes its control devicetree
# from the VideoCore firmware (OF_HAS_PRIOR_STAGE implies OF_BOARD, and
# board_fdt_blob_setup() in board/raspberrypi/rpi/rpi.c returns the firmware's
# pointer). That tree is built by the firmware from files on the FAT
# partition and config.txt, none of it verified, and it does not carry the
# FIT verification key, which the recipe inserts into U-Boot's own tree. With
# OF_BOARD off, fdtdec_setup() uses the tree appended to u-boot.bin
# (OF_SEPARATE), which carries the key. OF_OMIT_DTB defaults to y when
# OF_HAS_PRIOR_STAGE is set and would leave that tree out of u-boot.bin.
#
# Consequence: dram_init_banksize() of rpi.c is built only with OF_BOARD, so
# U-Boot falls back to the generic single bank of the size the firmware
# mailbox reports (the low ARM memory, below 1 GiB). Linux on this board
# sees that bank only until the memory above it is described.
# CONFIG_OF_BOARD is not set
CONFIG_OF_SEPARATE=y
# CONFIG_OF_OMIT_DTB is not set
CONFIG_DEFAULT_DEVICE_TREE="bcm2711-rpi-4-b"
# Writeable environment for A/B, as 0003 sets it for the Rock 5A defconfig.
CONFIG_ENV_FLAGS_LIST_STATIC="BOOT_ORDER:sw,BOOT_A_LEFT:dw,BOOT_B_LEFT:dw"
# No "pci enum; usb start" before boot_ab, and no USB keyboard as input: the
# boot path reads the SD card only.
# CONFIG_USE_PREBOOT is not set
# CONFIG_USB_KEYBOARD is not set

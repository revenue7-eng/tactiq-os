# U-Boot environment on the SD card, in the raw window in front of the first
# partition (tactiq-ab-rpi.wks.in), at the same offset and size as on the
# RK3588 boards, so tactiq-fw-env-setup.sh describes both.
# rpi_4_defconfig keeps the environment in a FAT file (uboot.env on 0:1);
# that file would sit on the unverified firmware partition.
CONFIG_ENV_IS_IN_MMC=y
# CONFIG_ENV_IS_IN_FAT is not set
# CONFIG_ENV_IS_NOWHERE is not set
CONFIG_ENV_OFFSET=0xB00000
CONFIG_ENV_SIZE=0x8000
# mmc 0 is the SD card on the Pi 4 (emmc2); rpi_4_defconfig's 0:1 is the
# same device.
CONFIG_ENV_MMC_DEVICE_INDEX=0

# Signed FIT verification in U-Boot.
#
# Required so the dm-verity root hash can be carried inside a signed FIT
# rather than in an editable extlinux.conf. See docs/design/verity-fit-ab.md.
#
# Capability only: enabling these symbols does not by itself make U-Boot
# reject an unsigned image. Enforcement requires the public key in the
# control FDT and a required-key marking, which is a separate step.
CONFIG_FIT=y
CONFIG_FIT_SIGNATURE=y
CONFIG_FIT_FULL_CHECK=y
CONFIG_RSA=y
CONFIG_SHA256=y

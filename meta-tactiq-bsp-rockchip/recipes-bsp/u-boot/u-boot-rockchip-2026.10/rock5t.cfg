# Rock 5T (tactiq-rock5t), stage 1: no TPM and no measured boot yet.
#
# rock5b-rk3588_defconfig builds the 5B, 5B+ and 5T devicetrees and picks one
# at run time from an ADC reading. The FIT verification key goes into one
# control devicetree only (TACTIQ_FIT_CONTROL_DTB), so the list is pinned to
# the 5T tree and nothing is chosen at run time.
CONFIG_DEFAULT_DEVICE_TREE="rockchip/rk3588-rock-5t"
CONFIG_OF_LIST="rockchip/rk3588-rock-5t"
CONFIG_DEFAULT_FDT_FILE="rockchip/rk3588-rock-5t.dtb"
# Writeable environment for A/B, as 0003 sets it for the Rock 5A defconfig.
CONFIG_ENV_FLAGS_LIST_STATIC="BOOT_ORDER:sw,BOOT_A_LEFT:dw,BOOT_B_LEFT:dw"

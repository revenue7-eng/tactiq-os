# Refuse a kernel FIT configuration whose signed rollback-index is below the
# floor in TPM NV 0x01500018 (patch 0010). Needs tpm-lock.cfg: the floor is
# safe from the OS only because the platform hierarchy is locked before it.
CONFIG_FIT_ROLLBACK_TPM=y
CONFIG_FIT_ROLLBACK_TPM_NV_INDEX=0x500018
# The floor is raised only for an image the slot has booted before, recorded
# in fit_seen_A and fit_seen_B; they must survive a reboot, so they join the
# importable list of 0003-configs-rock5a-rk3588s-declare-writeable-environment
# (this line repeats that list and adds them; do_configure checks the result).
CONFIG_ENV_FLAGS_LIST_STATIC="BOOT_ORDER:sw,BOOT_A_LEFT:dw,BOOT_B_LEFT:dw,fit_seen_A:sw,fit_seen_B:sw"

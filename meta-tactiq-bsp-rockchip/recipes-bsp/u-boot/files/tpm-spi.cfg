# TPM 2.0 support for the Infineon SLB9670 on spi4.
#
# TPM2_TIS_SPI depends on TPM_V2 && DM_SPI; TPM_V2 depends on TPM.
# DM_SPI is asserted explicitly because it is not set in
# rock5a-rk3588s_defconfig and is not visible in the static tree.
#
# CMD_TPM provides the tpm2 command, which is the only way to confirm
# from the U-Boot console that the device was found.
#
# Every symbol below must be verified in the resulting .config after
# the build: merge_config.sh is followed by olddefconfig, which drops
# symbols with unmet dependencies without reporting it.

CONFIG_TPM=y
CONFIG_TPM_V2=y
CONFIG_DM_SPI=y
CONFIG_ROCKCHIP_SPI=y
CONFIG_TPM2_TIS_SPI=y
CONFIG_CMD_TPM=y

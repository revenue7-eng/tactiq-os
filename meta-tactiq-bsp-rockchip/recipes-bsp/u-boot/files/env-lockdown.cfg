# Only variables with an explicit 'w' flag may be written, modified or
# imported at runtime. Selects ENV_APPEND, so the built-in environment is
# never dropped and reloaded from the saved copy in MMC — bootcmd cannot be
# overridden by writing raw sectors at CONFIG_ENV_OFFSET.
CONFIG_ENV_WRITEABLE_LIST=y
# Block 'env set -f' from overriding the access flags.
CONFIG_ENV_ACCESS_IGNORE_FORCE=y

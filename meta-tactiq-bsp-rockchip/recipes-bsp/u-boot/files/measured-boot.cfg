# Measured boot for the non-EFI path.
#
# The kernel is started as a bare arm64 Image through booti (extlinux.conf
# sets KERNEL /Image), so EFI boot services never start and the compiled-in
# EFI_TCG2_PROTOCOL never runs. MEASURED_BOOT is the mechanism that covers
# this path: boot/Kconfig calls it "Measure boot images and configuration
# when booting without EFI".
#
# Dependencies per boot/Kconfig: HASH && TPM_V2. Both are already y in the
# resulting .config, so nothing else is needed to make the symbol land.
#
# MEASURE_IGNORE_LOG: the event log area does not survive a reset on this
# board (a reset runs full DDR training, which is why ramoops loses its
# records - see the kernel-side patch 0004). Whatever is left in the area
# is stale, so it is discarded rather than appended to.
#
# MEASURE_DEVICETREE is default y under MEASURED_BOOT and is left on, but
# conditionally: the Kconfig help warns that a devicetree carrying per-boot
# data makes the measurement differ between boots. The DTB here comes from
# the tree, not generated at boot, so it should be stable. This must be
# confirmed by comparing the PCR across two boots before any reference
# value is published; if it moves, this symbol is the first suspect.
#
# The event log area itself is not a Kconfig symbol: it comes from the
# memory-region phandle on the tpm@0 node, added by patch 0006.
#
# Every symbol below must be verified in the resulting .config after the
# build: merge_config.sh is followed by olddefconfig, which drops symbols
# with unmet dependencies without reporting it.

CONFIG_MEASURED_BOOT=y
CONFIG_MEASURE_IGNORE_LOG=y
CONFIG_MEASURE_DEVICETREE=y

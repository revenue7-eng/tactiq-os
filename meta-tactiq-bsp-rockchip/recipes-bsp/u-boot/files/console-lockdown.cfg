# Production loader: autoboot with no delay and no check for abort, and no
# TPM commands at the prompt. Measurement is done by the boot code, which
# does not need them. Omitted when TACTIQ_UBOOT_CONSOLE = "1".
CONFIG_BOOTDELAY=-2
# CONFIG_CMD_TPM is not set
# CONFIG_CMD_TPM_V1 is not set
# CONFIG_CMD_TPM_V2 is not set

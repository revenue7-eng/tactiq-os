# Measured boot from SPL (patch 0007).
#
# SPL measures every image it loads from u-boot.itb (TF-A, U-Boot proper,
# the U-Boot devicetree) into the TPM before handing over, so the chain no
# longer starts at U-Boot proper vouching for itself.
#
# SPL_TPM          TPM uclass, TPM2 TIS SPI driver and lib/tpm-v2 in SPL
# SPL_SPI          SPI uclass in SPL (DM_SPI alone does not build it)
# SPL_GPIO         Rockchip GPIO in SPL, for the spi4 chip select (patch 0004)
# SPL_FIT_IMAGE_POST_PROCESS
#                  calls board_fit_image_post_process() after each image's
#                  hash is checked; spl-measure.c implements it
# SPL_SHA1/384/512 lib/tpm-v2.c extends every active PCR bank; the TPM on
#                  this board has sha1 active next to sha256
# SPL_SYS_MALLOC_F_LEN
#                  SPL binds every devicetree node in the pre-relocation heap.
#                  At the default 0x8000 the spi4 bus, the TPM and their pin
#                  and GPIO nodes did not get bound on the board ("no TPM
#                  device bound; first SPI bus: none"). SPL runs from DRAM on
#                  RK3588: the heap sits below the initial stack at 0x3f00000,
#                  clear of the relocated stack and malloc below 0x3e00000 and
#                  of the images SPL loads (0x60000-0xf6fff, 0xa00000).
# SPL_DM_WARN      report driver-model bind and probe failures in SPL
#                  instead of dropping them silently
#
# Every symbol below must be verified in the resulting .config after the
# build: merge_config.sh is followed by olddefconfig, which drops symbols
# with unmet dependencies without reporting it.

CONFIG_SPL_TPM=y
CONFIG_SPL_SPI=y
CONFIG_SPL_GPIO=y
CONFIG_SPL_FIT_IMAGE_POST_PROCESS=y
CONFIG_SPL_SHA1=y
CONFIG_SPL_SHA384=y
CONFIG_SPL_SHA512=y
CONFIG_SPL_SYS_MALLOC_F_LEN=0x20000
CONFIG_SPL_DM_WARN=y

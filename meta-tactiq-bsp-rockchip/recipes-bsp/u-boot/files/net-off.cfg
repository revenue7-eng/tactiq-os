# U-Boot without a network stack.
#
# The boot path is local only: bootcmd runs boot_ab, which loads the
# signed /fitImage from mmc and runs bootm (TACTIQ_BOOT_METHOD fit), or
# loads extlinux.conf with sysboot (extlinux variant). BOOTDELAY=-2 leaves
# no console to reach dhcp, tftpboot or pxe. Removing NET drops that code
# and the network CVE class from the bootloader. Checked by build: with
# NET off, do_load, do_bootm and do_sysboot stay, net_loop and eth_init
# are gone. sysboot stays on through boot-ab.cfg (CONFIG_CMD_SYSBOOT=y).
# CONFIG_NET is not set

# meta-tactiq-bsp-rockchip layer configuration
#
# Vendor BSP layer for Rockchip SoCs in TactiQ OS.
# Contains Rockchip-specific recipes (rkbin, u-boot), machine configs
# for Rock 5A / Rock 5T, and the Rockchip-specific wic template.
#
# Architecture: this layer depends on the vendor-agnostic base in
# meta-tactiq (conf/machine/include/tactiq-arm64-uboot-base.inc).
# It must NOT be required by other vendor BSP layers — cross-vendor
# coupling belongs in the core layer, not here.

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "tactiq-bsp-rockchip"
BBFILE_PATTERN_tactiq-bsp-rockchip = "^${LAYERDIR}/"
BBFILE_PRIORITY_tactiq-bsp-rockchip = "6"

LAYERDEPENDS_tactiq-bsp-rockchip = "core meta-tactiq"
LAYERSERIES_COMPAT_tactiq-bsp-rockchip = "scarthgap"

# wic templates: bitbake's wic plugin scans ${BBPATH}/wic/ automatically
# (BBPATH includes ${LAYERDIR} from the line above), so tactiq-ab-rockchip.wks.in
# in this layer's wic/ directory is found without any extra configuration.

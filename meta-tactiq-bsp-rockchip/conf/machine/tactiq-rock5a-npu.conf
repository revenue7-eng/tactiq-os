# TactiQ OS — Rock 5A NPU measurement machine.
#
# Derives from the hardened tactiq-rock5a release machine and adds ONLY
# the NPU enablement delta:
#   - "npu" override token  -> scopes NPU SRC_URI / PACKAGECONFIG appends
#   - "npu" MACHINE_FEATURE -> available for image-level conditionals
#   - KERNEL_DEVICETREE swap -> build-time-merged rk3588s-rock-5a-npu.dtb
#
# The release machine (tactiq-rock5a) carries none of these, so no NPU
# artifact can leak into a release build: the override token simply does
# not exist there. Build this MACHINE in a SEPARATE build dir; never in
# the qualified release tmp.
#
# Userspace stack: mainline "rocket" accel driver + Mesa Teflon (TFLite).

require conf/machine/tactiq-rock5a.conf

# Re-tag overrides: keep tactiq-rock5a lineage, add npu scope.
MACHINEOVERRIDES =. "tactiq-rock5a-npu:npu:"

MACHINE_FEATURES += "npu"

# Build-time-merged DTB (base + NPU overlay), produced by the Makefile
# *-dtbs rule the kernel patch adds. Replaces the stock single DTB.
KERNEL_DEVICETREE = "rockchip/rk3588s-rock-5a-npu.dtb"

COMPATIBLE_MACHINE:tactiq-rock5a-npu = "tactiq-rock5a-npu"

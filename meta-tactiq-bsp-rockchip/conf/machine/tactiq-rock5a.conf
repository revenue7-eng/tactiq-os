#@TYPE: Machine
#@NAME: TactiQ Rock 5A
#@DESCRIPTION: TactiQ OS on Radxa Rock 5A (RK3588S SoC)
#
# Board-specific machine config. RK3588 SoC family settings come from
# tactiq-rockchip-rk3588.inc; ARM64+U-Boot common from tactiq-arm64-uboot-base.inc.
#
# Usage:
#   MACHINE=tactiq-rock5a bitbake tactiq-image

require conf/machine/include/tactiq-rockchip-rk3588.inc

MACHINEOVERRIDES =. "tactiq-arm64:tactiq-rock5a:"

# ---- Board-specific ----
KERNEL_DEVICETREE = "rockchip/rk3588s-rock-5a.dtb"
UBOOT_MACHINE = "rock5a-rk3588s_defconfig"

MACHINE_FEATURES = "tpm2 emmc gpio spi i2c"
MACHINE_EXTRA_RRECOMMENDS = ""

COMPATIBLE_MACHINE:tactiq-rock5a = "tactiq-rock5a"

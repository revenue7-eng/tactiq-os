#@TYPE: Machine
#@NAME: TactiQ Rock 5T
#@DESCRIPTION: TactiQ OS on Radxa Rock 5T V1.2 (RK3588 SoC, 8GB LPDDR5)
#
# Rock 5T uses full RK3588 (not RK3588S). Same NPU 6 TOPS.
# Step 1: boot with Rock 5B DTB (same SoC, compatible pinout for UART/eMMC/SD)
# Step 2: backport Rock 5T DTS from kernel 6.17 for full HW support
#
# Board-specific machine config. RK3588 SoC family settings come from
# tactiq-rockchip-rk3588.inc; ARM64+U-Boot common from tactiq-arm64-uboot-base.inc.
#
# Usage:
#   MACHINE=tactiq-rock5t bitbake tactiq-image

require conf/machine/include/tactiq-rockchip-rk3588.inc

MACHINEOVERRIDES =. "tactiq-arm64:tactiq-rock5t:"

# ---- Board-specific ----
# Step 1: use Rock 5B DTB (RK3588, compatible for initial boot)
# Step 2: switch to rockchip/rk3588-rock-5t.dtb when DTS lands
KERNEL_DEVICETREE = "rockchip/rk3588-rock-5b.dtb"
UBOOT_MACHINE = "rock5b-rk3588_defconfig"

MACHINE_FEATURES = "tpm2 emmc gpio spi i2c pcie wifi ethernet"
MACHINE_EXTRA_RRECOMMENDS = ""

COMPATIBLE_MACHINE:tactiq-rock5t = "tactiq-rock5t"

# TactiQ OS — RK3588 USB host kernel fragment (BSP layer, SoC-specific).
# Phase 3: USB host stack for a UVC camera on Rock 5A. Built-in (=y), not
# modules — closed read-only appliance, no modprobe after flash.
#
# Mechanism-proof symbol: CONFIG_USB_DWC3_HOST. Base defconfig ships this as
# "is not set" (verified in .config); if it becomes =y after this fragment,
# the BSP delivery mechanism is PROVEN. Also fixes the audit's dwc3 fault:
# controller was DUAL_ROLE, a UVC camera needs HOST mode.
CONFIG_USB_DWC3=y
CONFIG_USB_DWC3_HOST=y

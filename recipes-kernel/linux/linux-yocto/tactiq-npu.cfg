# TactiQ OS — RK3588(S) NPU enablement fragment (mainline rocket stack)
# NPU-build ONLY. Not applied to the hardened release image.
#
# Userspace: Mesa Teflon (libteflon.so) — TFLite external delegate.
# Kernel uAPI: drivers/accel/rocket (DRM_ACCEL), NOT vendor rknpu.
# Requires matching DT status-override (rk3588s-rock-5a-npu.dts).

# DRM accel subsystem (parent of rocket)
CONFIG_DRM_ACCEL=y

# Rockchip NPU "rocket" driver — module so NPU is loadable/measurable
# without changing core boot path.
CONFIG_DRM_ACCEL_ROCKET=m

# IOMMU for the three rknn_mmu_* nodes the NPU cores sit behind.
CONFIG_ROCKCHIP_IOMMU=y

# TactiQ: since ~6.9 the kernel gates the legacy iptables family behind
# NETFILTER_XTABLES_LEGACY / IP(6)_NF_IPTABLES_LEGACY. linux-yocto 6.6
# defaults still shipped these modules; 6.18 defaults do not. The image
# explicitly installs the legacy table modules (iptable-filter/-mangle/
# -nat, ip6-tables, xt-*), so enable the gates and tables explicitly.
# NOTE: candidate for removal when the firewall stack migrates to native
# nftables rules (deliberate post-Stage-1 decision).
CONFIG_NETFILTER_XTABLES_LEGACY=y
CONFIG_IP_NF_IPTABLES_LEGACY=m
CONFIG_IP_NF_IPTABLES=m
CONFIG_IP_NF_FILTER=m
CONFIG_IP_NF_MANGLE=m
CONFIG_IP_NF_NAT=m
CONFIG_IP6_NF_IPTABLES_LEGACY=m
CONFIG_IP6_NF_IPTABLES=m
CONFIG_NETFILTER_XT_MATCH_CONNTRACK=m
CONFIG_NETFILTER_XT_MATCH_STATE=m

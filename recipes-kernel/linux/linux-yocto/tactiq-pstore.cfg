# Level 0 logging: kernel crash records that survive a reset.
#
# A failed A/B update panics before init and reboots on panic=5. Nothing
# userspace writes exists at that point, so journald cannot record why the
# slot failed: the only evidence is on the serial console, which requires a
# person with a cable. pstore/ram keeps the kernel log in a reserved RAM
# area that a warm reset does not clear, so the next boot can read it.
#
# PSTORE_RAM must be built in, not a module: the panic happens before the
# root filesystem is mounted and before any module is loaded.
CONFIG_PSTORE_RAM=y

# The dump alone is not enough. The diagnosis of a failed slot is in the
# lines BEFORE the panic (appraisal denials, mount errors, driver faults),
# and those are console output, not the panic record.
CONFIG_PSTORE_CONSOLE=y

# CONFIG_PSTORE and CONFIG_PSTORE_COMPRESS are already =y in the base
# configuration; repeated here would only hide where they come from.
# CONFIG_PSTORE_PMSG is deliberately left off: userspace messages belong in
# the journal, and a pmsg region is a write surface reachable from userspace.

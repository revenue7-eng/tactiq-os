# Load the IMA signer certificate into the .ima keyring at late_initcall,
# before systemd loads the custom policy. With
# With appraisal requiring signed policy (see IMA_APPRAISE_REQUIRE_POLICY_SIGS)
# the policy file must verify
# against .ima; the builtin trusted keyring alone is not consulted for
# appraisal (observed on target: "Request for unknown key 'id:cc67b774'
# in '.ima' keyring"). The cert file is installed by ima-evm-keys at the
# default CONFIG_IMA_X509_PATH (/etc/keys/x509_ima.der) and is accepted
# because it chains to the builtin cert (INTEGRITY_TRUSTED_KEYRING=y).
CONFIG_IMA_LOAD_X509=y

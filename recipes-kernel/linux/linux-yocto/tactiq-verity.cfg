# TactiQ OS - dm-verity for rootfs (RELEASE_INTEGRITY.md Phase 3)
#
# No initramfs (CONFIG_BLK_DEV_INITRD=n in tactiq-security.cfg), so the
# verity target must be created by the kernel itself before root mount.
# The dm-mod.create= command line parameter is enabled by DM_INIT below.
# Root hash lives in bootargs and is only trustworthy once bootargs are
# carried inside a signed FIT image (KERNEL_CLASSES, currently empty).

CONFIG_MD=y
CONFIG_BLK_DEV_DM=y
CONFIG_DM_INIT=y
CONFIG_DM_VERITY=y

# Root hash signature checked against the builtin trusted keyring
# (same bundle as IMA, see IMA_EVM_ROOT_CA in conf/distro/tactiq.conf).
# Inert until the image stage actually produces a signed root hash.
CONFIG_DM_VERITY_VERIFY_ROOTHASH_SIG=y

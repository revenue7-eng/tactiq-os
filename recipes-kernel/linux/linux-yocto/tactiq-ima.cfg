# IMA and the kernel keyrings. Takes the place of features/ima/ima.scc
# from the kernel cache, which meta-integrity adds to KERNEL_FEATURES when
# DISTRO_FEATURES has ima: KERNEL_FEATURES are applied after the fragments
# in SRC_URI, so a fragment of ours could not override it. The bbappend
# removes that feature; the lines below are its ima.cfg, the same values,
# except the two keyring options at the end.
CONFIG_IMA=y
CONFIG_IMA_LSM_RULES=y
CONFIG_IMA_MEASURE_PCR_IDX=10
CONFIG_IMA_SIG_TEMPLATE=y
CONFIG_IMA_DEFAULT_TEMPLATE="ima-sig"
CONFIG_IMA_DEFAULT_HASH_SHA256=y
CONFIG_IMA_DEFAULT_HASH="sha256"
CONFIG_IMA_ARCH_POLICY=y
CONFIG_IMA_APPRAISE_BUILD_POLICY=y
CONFIG_IMA_APPRAISE_REQUIRE_POLICY_SIGS=y
CONFIG_IMA_APPRAISE_SIGNED_INIT=y
CONFIG_IMA_MEASURE_ASYMMETRIC_KEYS=y
CONFIG_IMA_QUEUE_EARLY_BOOT_KEYS=y
CONFIG_IMA_SECURE_AND_OR_TRUSTED_BOOT=y
CONFIG_SIGNATURE=y
CONFIG_IMA_WRITE_POLICY=y
CONFIG_IMA_READ_POLICY=y
CONFIG_INTEGRITY=y
CONFIG_INTEGRITY_SIGNATURE=y
CONFIG_INTEGRITY_ASYMMETRIC_KEYS=y
CONFIG_EVM=y
CONFIG_KEYS=y
CONFIG_ASYMMETRIC_KEY_TYPE=y
CONFIG_SYSTEM_TRUSTED_KEYRING=y
CONFIG_ASYMMETRIC_PUBLIC_KEY_SUBTYPE=y
CONFIG_X509_CERTIFICATE_PARSER=y
CONFIG_PKCS8_PRIVATE_KEY_PARSER=y
CONFIG_CRYPTO_ECDSA=y
CONFIG_SECURITY=y
CONFIG_SECURITYFS=y

# Trust chain. .builtin_trusted_keys holds the module signing key and the
# IMA CA, nothing else: system-trusted-bundle.pem (IMA_EVM_ROOT_CA in
# conf/distro/tactiq.conf) is the IMA CA certificate alone, see gen-pki.sh
# ima. IMA verifies file and policy signatures against .ima only, which
# takes /etc/keys/x509_ima.der because the IMA CA signed it
# (tactiq-ima-keyring.cfg). The builtin keyring is also what module
# signatures are checked against, so it carries no CA that issues keys
# for anything else.
# No secondary keyring: this device gets keys only with an image, so no key
# is added at run time. .ima is then vouched for by builtin alone.
CONFIG_INTEGRITY_TRUSTED_KEYRING=y
# CONFIG_IMA_KEYRINGS_PERMIT_SIGNED_BY_BUILTIN_OR_SECONDARY is not set
# CONFIG_SECONDARY_TRUSTED_KEYRING is not set

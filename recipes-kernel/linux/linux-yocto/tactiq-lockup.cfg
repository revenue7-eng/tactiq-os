# TactiQ OS kernel availability fragment: turn silent hangs into panics.
# Applied to every machine via linux-yocto_%.bbappend, next to tactiq-security.cfg.
#
# Why (measured on rock5a): the hardware watchdog is sound. With
# /dev/watchdog0 opened and never fed, dw_wdt resets the board after ~89 s
# (2^31 cycles at 24 MHz, the TOP=15 ceiling). But the kernel shipped with no
# lockup detector at all, so a stuck CPU, a task hung in D-state, or an oops
# in a driver never becomes a panic. PID 1 keeps feeding the watchdog from a
# live CPU and the board sits half-dead with no reset. These options close
# the gap between "something hung" and "panic=5 reboots into the next A/B
# attempt" (see UBOOT_EXTLINUX_KERNEL_ARGS in linux-yocto_%.bbappend).
#
# Regression: echo c > /proc/sysrq-trigger must reboot within panic timeout.
# kill -STOP 1 is NOT a test: the kernel ignores default-action signals sent
# to the global init from userspace, so systemd never stops feeding.

# Softlockup: a CPU that does not schedule for 20+ s (BOOTPARAM sets the
# default of kernel.softlockup_panic=1).
CONFIG_LOCKUP_DETECTOR=y
CONFIG_SOFTLOCKUP_DETECTOR=y
CONFIG_BOOTPARAM_SOFTLOCKUP_PANIC=y

# Hardlockup: a CPU with interrupts stuck off. Kconfig picks the perf (PMU)
# or buddy implementation for the target; verify after build via
# /proc/sys/kernel/nmi_watchdog and dmesg.
CONFIG_HARDLOCKUP_DETECTOR=y

# Hung task: uninterruptible task for 120 s (D-state on a dead eMMC/SPI path).
CONFIG_DETECT_HUNG_TASK=y
CONFIG_DEFAULT_HUNG_TASK_TIMEOUT=120
CONFIG_BOOTPARAM_HUNG_TASK_PANIC=y

# Oops in kernel code is a panic, not a killed task with a corrupted kernel.
# Duplicated as panic_on_oops=1 on the command line so a foreign config
# cannot silently drop it.
CONFIG_PANIC_ON_OOPS=y
CONFIG_PANIC_ON_OOPS_VALUE=1

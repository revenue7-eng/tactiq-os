# TactiQ OS Kernel Security Configuration Fragment
# Applied to every machine via linux-yocto_%.bbappend, on top of whatever
# defconfig the BSP supplies.
# Current: appraisal runs in log mode (measure, don't enforce yet)
# Phase 3: Switch to enforce

# ---------------------------------------------------------------------------
# IMA - Integrity Measurement Architecture
# ---------------------------------------------------------------------------
CONFIG_INTEGRITY=y
CONFIG_IMA=y
CONFIG_IMA_MEASURE_PCR_IDX=10
CONFIG_IMA_LSM_RULES=y
CONFIG_IMA_APPRAISE=y
# Phase 3: CONFIG_IMA_APPRAISE_MODSIG=y
# Write-policy interface + SHA-256 default (2026-07-27).
# The write-policy interface opens /sys/kernel/security/ima/policy for a custom
# policy load at init (measurement profile only, gated by the
# tactiq-dev-policy override, see tactiq-rockchip-rk3588.inc). Without it only
# the built-in templates (tcb/appraise_tcb) are usable, and those do not cover
# arbitrary data paths such as /data/tactiq/measurement/.
CONFIG_IMA_WRITE_POLICY=y
# SHA-256 to match the rest of the supply chain (SBOM, SHA256SUMS). The
# kernel default is SHA-1, which is inconsistent with reference values
# everywhere else in the tree.
CONFIG_IMA_DEFAULT_HASH_SHA256=y
CONFIG_IMA_KEYRINGS_PERMIT_SIGNED_BY_BUILTIN_OR_SECONDARY=y
# Trust chain (2026-07-29): root-ca + signing-ca + leaf are compiled into
# .builtin_trusted_keys via system-trusted-bundle.pem (IMA_EVM_ROOT_CA in
# conf/distro/tactiq.conf). The kernel reaches cc67b774 through the possessor path in the
# builtin keyring, so no runtime .ima keyring load is required; .ima may stay
# empty at boot and appraisal falls through to builtin/secondary via
# the keyrings-permit-signed-by-builtin-or-secondary option set below.

# ---------------------------------------------------------------------------
# SELinux
# ---------------------------------------------------------------------------
CONFIG_SECURITY_SELINUX=y
CONFIG_SECURITY_SELINUX_DEVELOP=y
CONFIG_SECURITY_SELINUX_AVC_STATS=y
CONFIG_DEFAULT_SECURITY_SELINUX=y

# ---------------------------------------------------------------------------
# Kernel Lockdown (Phase 3)
# ---------------------------------------------------------------------------
CONFIG_SECURITY_LOCKDOWN_LSM=y
CONFIG_SECURITY_LOCKDOWN_LSM_EARLY=y
# Phase 3: CONFIG_LOCK_DOWN_KERNEL_FORCE_CONFIDENTIALITY=y

# ---------------------------------------------------------------------------
# Module signing
# ---------------------------------------------------------------------------
CONFIG_MODULE_SIG=y
CONFIG_MODULE_SIG_SHA256=y
# Phase 3: CONFIG_MODULE_SIG_FORCE=y

# ---------------------------------------------------------------------------
# Security hardening
# ---------------------------------------------------------------------------
CONFIG_STACKPROTECTOR=y
CONFIG_STACKPROTECTOR_STRONG=y
CONFIG_FORTIFY_SOURCE=y
CONFIG_HARDENED_USERCOPY=y
CONFIG_SLAB_FREELIST_HARDENED=y
CONFIG_SLAB_FREELIST_RANDOM=y
CONFIG_SHUFFLE_PAGE_ALLOCATOR=y
CONFIG_RANDOMIZE_BASE=y
CONFIG_RANDOMIZE_MEMORY=y

# Restrict unprivileged access
CONFIG_STRICT_DEVMEM=y
CONFIG_IO_STRICT_DEVMEM=y
CONFIG_SECURITY_DMESG_RESTRICT=y
CONFIG_PROC_KCORE=n
CONFIG_KEXEC=n
# kexec_file_load(2) is a second entry point into the same mechanism and
# comes from the defconfig as =y. Left open it lets a process holding
# CAP_SYS_BOOT boot an unsigned kernel, which defeats the reason
# BLK_DEV_INITRD is disabled below. Lockdown LSM is built but not armed
# (see Phase 3 above), so there is no second barrier today.
CONFIG_KEXEC_FILE=n

# ---------------------------------------------------------------------------
# Audit
# ---------------------------------------------------------------------------
CONFIG_AUDIT=y
CONFIG_AUDITSYSCALL=y

# ---------------------------------------------------------------------------
# Namespaces & cgroups (for systemd sandboxing)
# ---------------------------------------------------------------------------
CONFIG_NAMESPACES=y
CONFIG_USER_NS=y
CONFIG_PID_NS=y
CONFIG_NET_NS=y
CONFIG_CGROUPS=y
CONFIG_CGROUP_DEVICE=y
CONFIG_CGROUP_FREEZER=y
CONFIG_CGROUP_PIDS=y
CONFIG_MEMCG=y
CONFIG_CPUSETS=y

# ---------------------------------------------------------------------------
# Seccomp
# ---------------------------------------------------------------------------
CONFIG_SECCOMP=y
CONFIG_SECCOMP_FILTER=y

# ---------------------------------------------------------------------------
# TPM (kernel support built in from the start so a device can be used when present)
# ---------------------------------------------------------------------------
CONFIG_TCG_TPM=y
CONFIG_TCG_TIS_SPI=y
CONFIG_TCG_TIS_I2C=y
CONFIG_TCG_TIS=y
CONFIG_TCG_CRB=y
CONFIG_HW_RANDOM_TPM=y
# ---------------------------------------------------------------------------
# No initramfs (RELEASE_INTEGRITY.md §4)
# ---------------------------------------------------------------------------
# TactiQ OS boots the kernel directly into the rootfs on the partition
# selected by the bootloader. There is no initramfs. The kernel must
# not retain the capability to load one, so that an attacker who can
# write to boot media cannot supply an initramfs that bypasses our
# root-mount path.
CONFIG_BLK_DEV_INITRD=n
# ---------------------------------------------------------------------------
# Storage drivers built-in (RELEASE_INTEGRITY.md §4.3)
# ---------------------------------------------------------------------------
# Without initramfs there is no opportunity to load storage modules
# before root mount. All storage controllers and block layer drivers
# must be compiled in.
CONFIG_BLK_DEV_NVME=y
CONFIG_NVME_CORE=y

# Module signing key is pinned in-tree (see linux-yocto_%.bbappend, section 5).
# Any value other than the default disables the kernel build rule in certs/Makefile
# that would otherwise generate a fresh key on every clean build.
CONFIG_MODULE_SIG_KEY="certs/tactiq-module-signing.pem"

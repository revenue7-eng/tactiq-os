# TactiQ OS Kernel Security Configuration Fragment
# Applied on top of rock-5b defconfig
# Phase 1: Enable as modules (measure, don't enforce yet)
# Phase 3: Switch to enforce

# ---------------------------------------------------------------------------
# IMA - Integrity Measurement Architecture
# ---------------------------------------------------------------------------
CONFIG_INTEGRITY=y
CONFIG_IMA=y
CONFIG_IMA_MEASURE_PCR_IDX=10
CONFIG_IMA_LSM_RULES=y
CONFIG_IMA_APPRAISE=y
# Phase 3: CONFIG_IMA_APPRAISE_MODSIG=y

# ---------------------------------------------------------------------------
# SELinux
# ---------------------------------------------------------------------------
CONFIG_SECURITY_SELINUX=y
CONFIG_SECURITY_SELINUX_DEVELOP=y
CONFIG_SECURITY_SELINUX_AVC_STATS=y
CONFIG_SECURITY_SELINUX_CHECKREQPROT_VALUE=0
CONFIG_DEFAULT_SECURITY_SELINUX=y

# ---------------------------------------------------------------------------
# Kernel Lockdown (Phase 3)
# ---------------------------------------------------------------------------
CONFIG_SECURITY_LOCKDOWN_LSM=y
CONFIG_SECURITY_LOCKDOWN_LSM_EARLY=y
# Phase 3: CONFIG_LOCK_DOWN_KERNEL_FORCE_CONFIDENTIALITY=y

# ---------------------------------------------------------------------------
# Module signing
# ---------------------------------------------------------------------------
CONFIG_MODULE_SIG=y
CONFIG_MODULE_SIG_SHA256=y
# Phase 3: CONFIG_MODULE_SIG_FORCE=y

# ---------------------------------------------------------------------------
# Security hardening
# ---------------------------------------------------------------------------
CONFIG_STACKPROTECTOR=y
CONFIG_STACKPROTECTOR_STRONG=y
CONFIG_FORTIFY_SOURCE=y
CONFIG_HARDENED_USERCOPY=y
CONFIG_SLAB_FREELIST_HARDENED=y
CONFIG_SLAB_FREELIST_RANDOM=y
CONFIG_SHUFFLE_PAGE_ALLOCATOR=y
CONFIG_RANDOMIZE_BASE=y
CONFIG_RANDOMIZE_MEMORY=y

# Restrict unprivileged access
CONFIG_STRICT_DEVMEM=y
CONFIG_IO_STRICT_DEVMEM=y
CONFIG_SECURITY_DMESG_RESTRICT=y
CONFIG_PROC_KCORE=n
CONFIG_KEXEC=n

# ---------------------------------------------------------------------------
# Audit
# ---------------------------------------------------------------------------
CONFIG_AUDIT=y
CONFIG_AUDITSYSCALL=y

# ---------------------------------------------------------------------------
# Namespaces & cgroups (for systemd sandboxing)
# ---------------------------------------------------------------------------
CONFIG_NAMESPACES=y
CONFIG_USER_NS=y
CONFIG_PID_NS=y
CONFIG_NET_NS=y
CONFIG_CGROUPS=y
CONFIG_CGROUP_DEVICE=y
CONFIG_CGROUP_FREEZER=y
CONFIG_CGROUP_PIDS=y
CONFIG_MEMCG=y
CONFIG_CPUSETS=y

# ---------------------------------------------------------------------------
# Seccomp
# ---------------------------------------------------------------------------
CONFIG_SECCOMP=y
CONFIG_SECCOMP_FILTER=y

# ---------------------------------------------------------------------------
# TPM (Phase 4 - enable from start so kernel has support)
# ---------------------------------------------------------------------------
CONFIG_TCG_TPM=y
CONFIG_TCG_TIS_SPI=y
CONFIG_TCG_TIS_I2C=y
CONFIG_TCG_TIS=y
CONFIG_TCG_CRB=y
CONFIG_HW_RANDOM_TPM=y

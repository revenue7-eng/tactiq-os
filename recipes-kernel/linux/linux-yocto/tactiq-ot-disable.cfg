# TactiQ OS Kernel Attack-Surface Reduction Fragment
# Applied on top of tactiq-security.cfg to disable subsystems that have
# no use case on a hardened OT node adjacent to safety-related systems.
#
# Rationale: the anchor scenario (Class 3.2, air-gapped/segmented, no
# operator UI, no rotating storage, no radio) does not use virtualization,
# radio stacks, or non-primary filesystems. Every such subsystem left
# enabled expands the TCB and generates CVE triage load on code that
# never executes. Consistent with the existing precedent
# CONFIG_KEXEC=n in tactiq-security.cfg: remove capability whose only
# effect is to widen attack surface.
#
# If a future TactiQ platform (e.g. tactiq-box) needs any of these, that
# platform's kernel profile can re-enable them in its own fragment.

# ---------------------------------------------------------------------------
# Virtualization — not a hypervisor host
# ---------------------------------------------------------------------------
# The reference node runs bare-metal AI inference next to a Class 3.2
# safety context. No guest workloads. KVM and Xen exist only as attack
# surface here.
# CONFIG_KVM is not set
# CONFIG_XEN is not set

# ---------------------------------------------------------------------------
# Radio stacks — no wireless attach surface on the OT segment
# ---------------------------------------------------------------------------
# The device connects only via wired Ethernet to a segmented OT network.
# Removing Bluetooth and Wi-Fi eliminates radio stacks and their large
# CVE footprint from the TCB. RK3588S has BT/WLAN on-SoC; the driver
# code path is simply not compiled.
# CONFIG_BT is not set
# CONFIG_CFG80211 is not set
# CONFIG_MAC80211 is not set
# CONFIG_WLAN is not set

# ---------------------------------------------------------------------------
# Non-primary filesystems
# ---------------------------------------------------------------------------
# Storage layout is fixed at build time: ext4 A/B rootfs slots plus
# squashfs update bundles (see RAUC configuration). BTRFS and NFS are
# not part of any code path we execute.
# CONFIG_BTRFS_FS is not set
# CONFIG_NFS_FS is not set

# ---------------------------------------------------------------------------
# Graphics drivers for hardware not present
# ---------------------------------------------------------------------------
# Rock 5A ships with RK3588S integrated GPU (Mali). Nouveau targets
# NVIDIA GPUs, which are not on this SoC and cannot be attached.
# CONFIG_DRM_NOUVEAU is not set

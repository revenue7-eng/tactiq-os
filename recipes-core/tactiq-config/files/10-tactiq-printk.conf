# Console log level for the serial console.
#
# The board's only console is UART at 1500000 baud. At the kernel default
# (console_loglevel 7) it prints continuously, which makes the console
# unusable for interactive work on a board that has no other input path.
#
# Fields, in order: console_loglevel default_message_loglevel
#                   minimum_console_loglevel default_console_loglevel
#
# Only the first field is changed from the kernel default. It is the
# equivalent of "dmesg -n 1", which otherwise has to be retyped after
# every boot.
#
# This governs what is PRINTED to the console. It does not change what is
# recorded: the kernel ring buffer keeps filling at the same rate and
# "dmesg" returns the same contents either way.
#
# Applied by systemd-sysctl.service, i.e. in early userspace. Messages
# emitted before that point still reach the console.
kernel.printk = 1 4 1 7

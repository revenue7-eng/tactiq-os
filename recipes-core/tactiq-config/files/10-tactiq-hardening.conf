# TactiQ OS runtime hardening sysctls.
#
# kptr_restrict: kernel pointers in /proc and dmesg are readable by any
# process at 0, which hands an attacker the KASLR offset and defeats
# CONFIG_RANDOMIZE_BASE. 1 hides them from unprivileged readers; 2 hides
# them from everyone including root, which is what an unattended appliance
# with no interactive login should do.
kernel.kptr_restrict = 2

# ptrace_scope: requires CONFIG_SECURITY_YAMA, added to tactiq-security.cfg
# in the same change. 1 means a process may only attach to its own
# descendants, so a compromised service cannot read the memory of another
# service running as the same user.
kernel.yama.ptrace_scope = 1

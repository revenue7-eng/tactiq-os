# Level 0 logging: the journal must survive a reboot.
#
# /var/log is a volatile bind mount on this image, so the default
# Storage=auto keeps the journal in RAM and every reboot discards it. A
# device in the field has no network and no operator with a console cable:
# if the record does not survive the reset, the failure leaves no evidence
# at all.
#
# The on-disk directory is /data/log/journal, bind-mounted onto
# /var/log/journal by tactiq-log-setup.service before the journal is
# flushed. Storage=persistent without that mount would write into the
# volatile copy and change nothing.
[Journal]
Storage=persistent
Compress=yes

# /data is 3.8G and shared with the vault. Bound the journal so a log
# storm cannot take the partition away from the data it exists to hold.
SystemMaxUse=256M
SystemKeepFree=512M
SystemMaxFileSize=32M
RuntimeMaxUse=32M

[system]
compatible=TactiQ OS Rock5A
bootloader=uboot
# Central status file instead of per-slot slot.raucs. Per-slot status makes
# RAUC mount every slot read-write at start-up and write slot.raucs into a
# freshly installed rootfs; either write changes a dm-verity rootfs and it
# no longer boots. /var/lib is volatile, so status does not survive reboot;
# boot decisions live in the U-Boot environment and are not affected.
data-directory=/var/lib/rauc
bundle-formats=-plain

[slot.rootfs.0]
device=/dev/disk/by-partlabel/rootfs_a
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partlabel/rootfs_b
type=ext4
bootname=B

[slot.boot.0]
device=/dev/disk/by-partlabel/boot_a
type=ext4
parent=rootfs.0

[slot.boot.1]
device=/dev/disk/by-partlabel/boot_b
type=ext4
parent=rootfs.1

[keyring]
path=/etc/rauc/root-ca.pem
check-purpose=codesign-rauc

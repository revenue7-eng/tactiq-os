[system]
compatible=TactiQ OS Rock5A
bootloader=uboot
bundle-formats=-plain

[slot.rootfs.0]
device=/dev/disk/by-partlabel/rootfs_a
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partlabel/rootfs_b
type=ext4
bootname=B

[slot.boot.0]
device=/dev/disk/by-partlabel/boot_a
type=ext4
parent=rootfs.0

[slot.boot.1]
device=/dev/disk/by-partlabel/boot_b
type=ext4
parent=rootfs.1

[keyring]
path=/etc/rauc/ca.cert.pem

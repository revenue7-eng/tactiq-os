#@TYPE: Machine
#@NAME: TactiQ Rock 5B
#@DESCRIPTION: TactiQ OS on Radxa Rock 5B (RK3588 SoC)
#
# Hardware-specific target. Extends generic ARM64 with RK3588 support.
# Requires: meta-rockchip BSP layer.
#
# Usage:
#   MACHINE=tactiq-rock5b bitbake tactiq-image

require conf/machine/rock-5b.conf

MACHINEOVERRIDES =. "tactiq-arm64:tactiq-rock5b:"

# Kernel
KERNEL_FEATURES:append = " \
    cfg/tactiq-security.cfg \
"

# Serial console (Rockchip uses 1500000 baud)
SERIAL_CONSOLES = "1500000;ttyS2"

# Boot
UBOOT_MACHINE = "rock-5b-rk3588_defconfig"
UBOOT_EXTLINUX = "1"

# Partition layout
WKS_FILE = "tactiq-ab.wks.in"
IMAGE_FSTYPES = "wic wic.gz ext4 tar.gz"

# Hardware features
MACHINE_FEATURES:append = " tpm2 emmc gpio spi i2c"

# Preferred kernel
PREFERRED_VERSION_linux-rockchip = "6.6%"

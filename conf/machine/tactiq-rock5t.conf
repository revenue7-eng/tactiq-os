#@TYPE: Machine
#@NAME: TactiQ Rock 5T
#@DESCRIPTION: TactiQ OS on Radxa Rock 5T V1.2 (RK3588 SoC, 8GB LPDDR5)
#
# Rock 5T uses full RK3588 (not RK3588S). Same NPU 6 TOPS.
# Phase 1: boot with Rock 5B DTB (same SoC, compatible pinout for UART/eMMC/SD)
# Phase 2: backport Rock 5T DTS from kernel 6.17 for full HW support
#
# Usage:
#   MACHINE=tactiq-rock5t bitbake tactiq-image

require conf/machine/include/arm/armv8-2a/tune-cortexa76-cortexa55.inc

MACHINEOVERRIDES =. "tactiq-arm64:tactiq-rock5t:"

# Kernel
PREFERRED_PROVIDER_virtual/kernel = "linux-yocto"
PREFERRED_VERSION_linux-yocto = "6.6%"
KERNEL_IMAGETYPE = "Image"
# Phase 1: use Rock 5B DTB (RK3588, compatible for initial boot)
# Phase 2: switch to rockchip/rk3588-rock-5t.dtb
KERNEL_DEVICETREE = "rockchip/rk3588-rock-5b.dtb"

# Serial console (Rockchip RK3588 uses 1500000 baud on ttyS2)
SERIAL_CONSOLES = "1500000;ttyS2"

# Bootloader
PREFERRED_PROVIDER_virtual/bootloader = "u-boot-rockchip"
UBOOT_MACHINE = "rock5b-rk3588_defconfig"

# Partition layout (A/B with SPI+eMMC)
WKS_FILE = "tactiq-ab.wks.in"
IMAGE_FSTYPES = "wic wic.gz ext4 tar.gz"

# Hardware features
MACHINE_FEATURES = "tpm2 emmc gpio spi i2c pcie wifi ethernet"
MACHINE_EXTRA_RRECOMMENDS = ""

# Kernel config
KBUILD_DEFCONFIG = "defconfig"
KCONFIG_MODE = "alldefconfig"

COMPATIBLE_MACHINE:tactiq-rock5t = "tactiq-rock5t"

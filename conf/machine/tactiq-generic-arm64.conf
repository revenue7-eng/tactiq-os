#@TYPE: Machine
#@NAME: TactiQ Generic ARM64
#@DESCRIPTION: TactiQ OS for generic ARM64 platforms (Raspberry Pi 4/5, NXP i.MX, TI AM62x, etc.)
#
# Base machine for ARM64 targets. Specific boards override this.
# Uses mainline kernel, UEFI boot, generic devicetree.
#
# Usage:
#   MACHINE=tactiq-generic-arm64 bitbake tactiq-image

require conf/machine/qemuarm64.conf

MACHINEOVERRIDES =. "tactiq-arm64:"

# ---------------------------------------------------------------------------
# Kernel
# ---------------------------------------------------------------------------
PREFERRED_PROVIDER_virtual/kernel = "linux-yocto"
PREFERRED_VERSION_linux-yocto = "6.6%"

KERNEL_FEATURES:append = " \
    cfg/tactiq-security.cfg \
"

# ---------------------------------------------------------------------------
# Serial console (board-specific override expected)
# ---------------------------------------------------------------------------
SERIAL_CONSOLES = "115200;ttyAMA0"

# ---------------------------------------------------------------------------
# Partition layout
# ---------------------------------------------------------------------------
WKS_FILE = "tactiq-ab.wks.in"
IMAGE_FSTYPES = "wic wic.gz ext4 tar.gz"

# ---------------------------------------------------------------------------
# Hardware features (override per-board)
# ---------------------------------------------------------------------------
MACHINE_FEATURES:append = " tpm2"

# ---------------------------------------------------------------------------
# QEMU ARM64 options (for testing ARM64 builds on x86 host)
# ---------------------------------------------------------------------------
QB_SYSTEM_NAME = "qemu-system-aarch64"
QB_MEM = "-m 1024"
QB_MACHINE = "-machine virt"
QB_CPU = "-cpu cortex-a57"

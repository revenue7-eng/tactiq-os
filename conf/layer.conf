# TactiQ OS Yocto Layer Configuration
# Layer: meta-tactiq
# Purpose: Custom distro, machine, recipes for TactiQ Edge security platform
# Target: Radxa Rock 5B (RK3588)

BBPATH .= ":${LAYERDIR}"

BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "meta-tactiq"
BBFILE_PATTERN_meta-tactiq = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-tactiq = "10"

LAYERDEPENDS_meta-tactiq = " \
    core \
    openembedded-layer \
    meta-python \
    networking-layer \
"

LAYERSERIES_COMPAT_meta-tactiq = "scarthgap"

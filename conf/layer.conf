# TactiQ OS Yocto Layer Configuration
# Layer:   meta-tactiq
# Purpose: Vendor-agnostic core layer for TactiQ OS — distro definition,
#          security model, supply chain, userspace, build infrastructure.
# Scope:   Core. Contains no SoC/vendor/board-specific recipes or configs.
#          Vendor-specific concerns live in meta-tactiq-bsp-* layers.

BBPATH .= ":${LAYERDIR}"

BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "meta-tactiq"
BBFILE_PATTERN_meta-tactiq = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-tactiq = "10"

LAYERDEPENDS_meta-tactiq = " \
    core \
    openembedded-layer \
    meta-python \
    networking-layer \
"

LAYERSERIES_COMPAT_meta-tactiq = "wrynose"


# Exported so recipes can locate in-tree assets (e.g. pki/).
LAYERDIR_tactiq-os = "${LAYERDIR}"

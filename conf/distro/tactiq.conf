# TactiQ OS Distribution Configuration
# DISTRO = "tactiq"
#
# Security-hardened embedded Linux distribution for TactiQ Edge platform.
# Based on Poky with systemd, SELinux, IMA, and TPM2 support.

DISTRO = "tactiq"
DISTRO_NAME = "TactiQ OS"
DISTRO_VERSION = "2.0.0"
DISTRO_CODENAME = "hardened-edge"

# Maintainer
MAINTAINER = "TactiQ Engineering <eng@tactiqedge.com>"

# ---------------------------------------------------------------------------
# Init system: systemd (required for sandboxing, watchdog, target switching)
# ---------------------------------------------------------------------------
DISTRO_FEATURES:append = " systemd usrmerge"
DISTRO_FEATURES_OPTED_OUT:append = " sysvinit"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"
VIRTUAL-RUNTIME_login_manager = "shadow-base"
VIRTUAL-RUNTIME_dev_manager = "systemd"

# ---------------------------------------------------------------------------
# Security features
# ---------------------------------------------------------------------------
# SELinux - mandatory access control
DISTRO_FEATURES:append = " selinux"

# PAM - pluggable authentication
DISTRO_FEATURES:append = " pam"

# TPM2 - hardware root of trust (Phase 4)
DISTRO_FEATURES:append = " tpm2"
DISTRO_FEATURES:append = " rauc"

# Seccomp - syscall filtering
DISTRO_FEATURES:append = " seccomp"

# ---------------------------------------------------------------------------
# Networking
# ---------------------------------------------------------------------------
DISTRO_FEATURES:append = " ipv4 ipv6"

# ---------------------------------------------------------------------------
# Remove unnecessary features (attack surface reduction)
# ---------------------------------------------------------------------------
DISTRO_FEATURES:remove = "x11 wayland vulkan pulseaudio bluetooth nfc 3g alsa wifi zeroconf nfs pcmcia pci"
DISTRO_FEATURES:remove = "gobject-introspection-data"

# ---------------------------------------------------------------------------
# Reproducible builds
# ---------------------------------------------------------------------------
BUILD_REPRODUCIBLE_BINARIES = "1"

# ---------------------------------------------------------------------------
# Security compiler flags
# ---------------------------------------------------------------------------
# Stack protector, FORTIFY_SOURCE, relro, bind-now, PIE
SECURITY_CFLAGS = "-fstack-protector-strong -D_FORTIFY_SOURCE=2"
SECURITY_LDFLAGS = "-Wl,-z,relro,-z,now"
TARGET_CFLAGS:append = " ${SECURITY_CFLAGS}"
TARGET_LDFLAGS:append = " ${SECURITY_LDFLAGS}"

# ---------------------------------------------------------------------------
# Package management: opkg (lightweight, for OTA component updates)
# ---------------------------------------------------------------------------
PACKAGE_CLASSES = "package_ipk"

# ---------------------------------------------------------------------------
# License compliance
# ---------------------------------------------------------------------------
INHERIT += "archiver"
ARCHIVER_MODE[src] = "original"

# ---------------------------------------------------------------------------
# CVE checking - enabled at distro level via sbom-cve-check (wrynose removed cve-check) so every build produces a CVE report
# ---------------------------------------------------------------------------
IMAGE_CLASSES:append = " sbom-cve-check"

# Kernel SPDX must carry the compiled-sources file list so the post-release
# enrich-cve.sh triage (improve_kernel_cve_report.py) can resolve linux-yocto
# CVEs against actually-compiled sources. Always-on, not local.conf: the
# published CVE posture must reproduce from a clean clone. ~65 MB kernel SPDX
# sits in the same supply-chain tier as the archiver original-src above.
SPDX_INCLUDE_COMPILED_SOURCES:pn-linux-yocto = "1"

# ---------------------------------------------------------------------------
# SDK
# ---------------------------------------------------------------------------
SDK_NAME = "${DISTRO}-${TCLIBC}-${SDKMACHINE}-${IMAGE_BASENAME}-${TUNE_PKGARCH}-${MACHINE}"
SDK_VERSION = "${DISTRO_VERSION}"

# ---------------------------------------------------------------------------
# Preferred versions (pin for reproducibility)
# ---------------------------------------------------------------------------
# Kernel: linux-yocto, 6.6 LTS series; pin lives in linux-yocto bbappend.
# Vendor-specific kernel patches (DTS, drivers) come from BSP layers.

# Go: 1.22+ for agent cross-compilation
PREFERRED_VERSION_go-cross-${TARGET_ARCH} = "1.22%"
PREFERRED_VERSION_go-native = "1.22%"

# wrynose: oe-core default DISTRO_FEATURES now include "debuginfod", which
# makes binutils/gdb configure --with-debuginfod (objdump FTBFS: elfutils in
# this configuration ships no debuginfod headers). TactiQ is offline-first:
# pulling debug symbols from network debuginfod servers contradicts the
# security model. Remove the feature entirely.
DISTRO_FEATURES:remove = "debuginfod"


# opengl ONLY on the NPU machine: enables the mesa build for libteflon. The
# npu override is inactive on release, so hardening is untouched there.
DISTRO_FEATURES:append:npu = " opengl"

# TactiQ OS Distribution Configuration
# DISTRO = "tactiq"
#
# Security-hardened embedded Linux distribution for TactiQ Edge platform.
# Based on Poky with systemd, SELinux, IMA, and TPM2 support.

DISTRO = "tactiq"
DISTRO_NAME = "TactiQ OS"
DISTRO_VERSION = "2.1.0"
DISTRO_CODENAME = "hardened-edge"

# Maintainer
MAINTAINER = "TactiQ Engineering <eng@tactiqedge.com>"

# ---------------------------------------------------------------------------
# Init system: systemd (required for sandboxing, watchdog, target switching)
# ---------------------------------------------------------------------------
DISTRO_FEATURES:append = " systemd usrmerge"
DISTRO_FEATURES_OPTED_OUT:append = " sysvinit"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"
VIRTUAL-RUNTIME_login_manager = "shadow-base"
VIRTUAL-RUNTIME_dev_manager = "systemd"

# ---------------------------------------------------------------------------
# Security features
# ---------------------------------------------------------------------------
# SELinux - mandatory access control
DISTRO_FEATURES:append = " selinux"

# PAM - pluggable authentication
DISTRO_FEATURES:append = " pam"

# TPM2 - hardware root of trust; the reference board carries a discrete SLB9670 on SPI4
DISTRO_FEATURES:append = " tpm2"
DISTRO_FEATURES:append = " rauc"

# RAUC verification keyring. "dev" installs the in-tree development root
# from pki/dev/, whose private keys are public by design, so anyone can
# build a bundle the image accepts and confirm that a production image
# rejects it. Any other value requires RAUC_KEYRING_FILE to be supplied
# from outside the tree; recipes-core/rauc refuses to build without it.
TACTIQ_KEYRING ??= "dev"

# Seccomp - syscall filtering
DISTRO_FEATURES:append = " seccomp"

# IMA/EVM - file integrity measurement and appraisal.
# The feature pulls in ima-evm-utils and the kernel integrity subsystem.
# Signing of a rootfs is not enabled here: it is applied per image by
# IMAGE_CLASSES += "ima-evm-rootfs", which today only tactiq-image-dev.bb
# carries. A production image built from this distro is therefore not
# signed by the in-tree development key.
DISTRO_FEATURES:append = " integrity ima"

# IMA appraisal signing material. Same pki/dev/ hierarchy as RAUC and
# module signing; the private half is in-tree by the same design property
# (see pki/README.md). ima-evm-rootfs installs IMA_EVM_POLICY into the
# image as /etc/ima/ima-policy, so no separate recipe ships the policy.
IMA_EVM_KEY_DIR ?= "${LAYERDIR_tactiq-os}/pki/dev"
IMA_EVM_PRIVKEY ?= "${IMA_EVM_KEY_DIR}/ima-signer.key.pem"
IMA_EVM_X509 ?= "${IMA_EVM_KEY_DIR}/ima-signer.der"
IMA_EVM_ROOT_CA ?= "${IMA_EVM_KEY_DIR}/system-trusted-bundle.pem"
IMA_EVM_POLICY ?= "${LAYERDIR_tactiq-os}/recipes-security/ima-policy/files/tactiq-ima-appraise.policy"

# ---------------------------------------------------------------------------
# Networking
# ---------------------------------------------------------------------------
DISTRO_FEATURES:append = " ipv4 ipv6"

# ---------------------------------------------------------------------------
# Remove unnecessary features (attack surface reduction)
# ---------------------------------------------------------------------------
DISTRO_FEATURES:remove = "x11 wayland vulkan opengl pulseaudio bluetooth nfc 3g alsa wifi zeroconf nfs pcmcia pci"
DISTRO_FEATURES:remove = "gobject-introspection-data"

# ---------------------------------------------------------------------------
# Reproducible builds
# ---------------------------------------------------------------------------
BUILD_REPRODUCIBLE_BINARIES = "1"

# Source acquisition order. Upstream release URLs are not immutable: zlib.net
# re-rolled zlib-1.3.2 under the same filename, which fails the pinned
# checksum and stops the build. Integrity held; availability did not. Note
# that oe-core's MIRRORS are consulted only when a fetch fails at the network
# level, not when a checksum mismatches, so an upstream that still answers
# but has changed its bytes is a single point of failure for that recipe.
#
# own-mirrors inverts the order: the archive is tried first and the mutable
# upstream becomes the fallback. Checksums are still enforced from the pinned
# oe-core recipes, so the mirror is asked for bytes, not trusted for them.
#
# Same rationale as SPDX_INCLUDE_COMPILED_SOURCES below: this has to hold for
# a build from a clean clone, so it belongs to the distro definition and not
# to a local.conf on one machine. The endpoint is a self-hosted frozen mirror
# together with BB_FETCH_PREMIRRORONLY, which removes the live network from
# source acquisition entirely; reaching it changes this URL and nothing else.
INHERIT += "own-mirrors"
SOURCE_MIRROR_URL = "https://downloads.yoctoproject.org/mirror/sources/"

# ---------------------------------------------------------------------------
# Security compiler flags
# ---------------------------------------------------------------------------
# Stack protector, FORTIFY_SOURCE, relro, bind-now, PIE
SECURITY_CFLAGS = "-fstack-protector-strong -D_FORTIFY_SOURCE=2"
SECURITY_LDFLAGS = "-Wl,-z,relro,-z,now"
TARGET_CFLAGS:append = " ${SECURITY_CFLAGS}"
TARGET_LDFLAGS:append = " ${SECURITY_LDFLAGS}"

# ---------------------------------------------------------------------------
# Package management: opkg (lightweight, for OTA component updates)
# ---------------------------------------------------------------------------
PACKAGE_CLASSES = "package_ipk"

# ---------------------------------------------------------------------------
# License compliance
# ---------------------------------------------------------------------------
INHERIT += "archiver"
ARCHIVER_MODE[src] = "original"

# ---------------------------------------------------------------------------
# CVE checking - enabled at distro level via sbom-cve-check (wrynose removed cve-check) so every build produces a CVE report
# ---------------------------------------------------------------------------
IMAGE_CLASSES:append = " sbom-cve-check"

# Kernel SPDX must carry the compiled-sources file list so the post-release
# enrich-cve.sh triage (improve_kernel_cve_report.py) can resolve linux-yocto
# CVEs against actually-compiled sources. Always-on, not local.conf: the
# published CVE posture must reproduce from a clean clone. ~65 MB kernel SPDX
# sits in the same supply-chain tier as the archiver original-src above.
SPDX_INCLUDE_COMPILED_SOURCES:pn-linux-yocto = "1"

# ---------------------------------------------------------------------------
# dm-verity hash tree generation
# ---------------------------------------------------------------------------
# The class is enabled distro-wide but generates nothing on its own: an image
# only gets a hash tree if it also lists "verity" in IMAGE_FSTYPES. This
# follows the rule above for ima-evm-rootfs — the capability belongs to the
# distro, the decision to apply it belongs to the image — with one difference:
# no key material is involved here, so there is no development-key hazard in
# enabling it broadly.
#
# VERITY_SALT is fixed and permanent. It is not a secret (it travels in the
# kernel command line), but changing it invalidates every root hash ever
# published and every FIT signature over one. The class defaults to a public
# constant from its own header and only warns when the salt is unset, so
# leaving this unset would build successfully with a shared salt.
#
# NOT ESTABLISHED: the root hash is not yet signed and nothing verifies it at
# boot. Generation is one of three changes; the wks source and the RAUC bundle
# file still reference the plain ext4 image.
IMAGE_CLASSES:append = " image_types_verity"
VERITY_SALT = "8a7b98d830ac3bf9daa968b9c322bc1e6d9300c632f8f610be59dd67d2c4d797"

# ---------------------------------------------------------------------------
# SDK
# ---------------------------------------------------------------------------
SDK_NAME = "${DISTRO}-${TCLIBC}-${SDKMACHINE}-${IMAGE_BASENAME}-${TUNE_PKGARCH}-${MACHINE}"
SDK_VERSION = "${DISTRO_VERSION}"

# ---------------------------------------------------------------------------
# Preferred versions (pin for reproducibility)
# ---------------------------------------------------------------------------
# Kernel: linux-yocto, 6.18 series for board targets (6.6 LTS for QEMU/generic); pin lives in linux-yocto bbappend.
# Vendor-specific kernel patches (DTS, drivers) come from BSP layers.

# Go: 1.22+ for agent cross-compilation
PREFERRED_VERSION_go-cross-${TARGET_ARCH} = "1.22%"
PREFERRED_VERSION_go-native = "1.22%"

# wrynose: oe-core default DISTRO_FEATURES now include "debuginfod", which
# makes binutils/gdb configure --with-debuginfod (objdump FTBFS: elfutils in
# this configuration ships no debuginfod headers). TactiQ is offline-first:
# pulling debug symbols from network debuginfod servers contradicts the
# security model. Remove the feature entirely.
DISTRO_FEATURES:remove = "debuginfod"



# TactiQ OS chrony configuration.
# No default time source. The device never contacts public NTP pools.
# A deployment declares its local reference by adding a .sources file
# to /etc/chrony/sources.d/ in the deployment image.
confdir /etc/chrony/conf.d
sourcedir /etc/chrony/sources.d
makestep 1.0 3
driftfile /var/lib/chrony/drift
rtcsync
logdir /var/log/chrony

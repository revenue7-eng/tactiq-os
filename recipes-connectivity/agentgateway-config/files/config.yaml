# yaml-language-server: $schema=https://agentgateway.dev/schema/config
# ============================================================================
# TactiQ OS: agentgateway production config (v1, one reference tool)
# ----------------------------------------------------------------------------
# In-perimeter MCP/A2A traffic mediation. Local mediation ONLY.
#
# NETWORK POSTURE (zero-egress):
#   - Listener: agentgateway binds 0.0.0.0:<port> by design. The file config
#     exposes only `port`; the bind address is hardcoded to UNSPECIFIED in the
#     binary (crates/agentgateway/src/types/local.rs). With IPv6 enabled, the
#     default, that is [::] and not 0.0.0.0, and to decide it the gateway
#     reads /proc/sys/net/ipv6/conf/lo/disable_ipv6, which agentgateway_t
#     may not (bench, 26.10.2026). enableIpv6: false below makes it 0.0.0.0
#     and skips that read. Loopback confinement is enforced OUTSIDE the
#     binary, in three layers:
#       1. systemd  — IPAddressDeny=any + IPAddressAllow=localhost  (agentgateway.service)
#       2. firewall — NOT IMPLEMENTED. An image-level iptables rule was
#                     considered and is absent from the tree. Not an active
#                     layer until an artifact says otherwise.
#       3. SELinux  — agentgateway_t: corenet_tcp_bind on 49317 only,
#                     no name_connect outward, no DNS resolve.
#     A 0.0.0.0 bind is NOT a defect: kernel-level filtering is a stronger
#     guarantee than an app-level loopback bind (which would live inside the
#     untrusted third-party binary).
#
#   - Port 49317: from the IANA dynamic/private range (49152-65535), verified
#     free against the whole of corenetwork.te.in — nearest occupied are 49216
#     below and 50000 above. The earlier choice 49190 fell inside the
#     virt_migration range (49152-49216, corenetwork.te.in:296): the bind
#     would have been checked against virt_migration_port_t and denied. Fixed
#     and documented because the SELinux bind rule and the client depend on it.
#
#   - Backends: one MCP target, the reference tool of the development image
#     (tactiq-reftool, below). It shows the tool boundary of the SELinux policy
#     acting; it reads and changes nothing on the device.
#     When real MCP servers are added they MUST be local stdio processes
#     addressed by ABSOLUTE PATH (no `npx`, no `docker`, no `host:` HTTP target
#     — each of those would be runtime network egress and break offline-first).
#     Every new stdio target also requires a matching SELinux domain
#     transition from agentgateway_t, with nnp_transition (the gateway runs
#     with NoNewPrivileges), and its types in the tool attributes of
#     tactiq_fixes; tactiq_reftool.te in tactiq-os-selinux is the pattern.
# ============================================================================

# STOP CHECK (extAuthz):
#   Every request on this listener is first sent to tactiq-stop on
#   127.0.0.1:49318. 2xx lets it through; anything else, or no answer, denies
#   it (failureMode: deny), and a 403 body (the signed refusal receipt) goes
#   back to the caller unchanged. The block sits in the listener's policies,
#   not on a route, so it covers every route, present and future.
#   Settings tactiq-stop checks before it starts, and why:
#     - requestTimeout: at agentgateway d204f9c the http check has a fixed
#       200 ms timeout and this value is NOT applied to it (the extAuthz
#       policies are not passed to the call). The agentgateway recipe patches
#       the timeout to 10 s; a signed refusal took 2.4 s on the bench. The
#       value is kept for a gateway revision that honours it.
#     - includeRequestBody with an explicit maxRequestBytes: the schema
#       default is 0, which would send no body; the request digest in a
#       refusal covers the body as sent, up to this many bytes.
#     - allowPartialMessage: false, stated explicitly.
#   tests/agentgateway/test_extauthz_config.py parses this file and fails the
#   build if any listener lacks this block or any value drifts.
#
# MANAGEMENT LISTENERS:
#   agentgateway always opens admin (15000), stats (15020) and readiness
#   (15021) listeners; stats and readiness default to every interface. All
#   three are bound to loopback here. Their port type (agentgateway_mgmt_port_t)
#   lets agentgateway_t bind exactly these numbers.
# ============================================================================

config:
  enableIpv6: false
  adminAddr: 127.0.0.1:15000
  statsAddr: 127.0.0.1:15020
  readinessAddr: 127.0.0.1:15021

binds:
- port: 49317
  listeners:
  - policies:
      extAuthz:
        host: 127.0.0.1:49318
        protocol:
          http:
            path: null
        failureMode: deny
        includeRequestBody:
          maxRequestBytes: 1048576
          allowPartialMessage: false
        policies:
          http:
            requestTimeout: 5s
    routes:
    # Reference tool (development image only, package tactiq-reftool): an MCP
    # server on stdio, by absolute path, as the BACKENDS rule above requires.
    # statefulMode stateless: the gateway starts the tool for each request and
    # stops it after, so no tool process outlives a call, and a caller needs
    # no session. Where the package is absent (a release has no gateway yet)
    # the start fails and the call is refused.
    - backends:
      - mcp:
          statefulMode: stateless
          targets:
          - name: reftool
            stdio:
              cmd: /opt/tactiq/bin/tactiq-reftool

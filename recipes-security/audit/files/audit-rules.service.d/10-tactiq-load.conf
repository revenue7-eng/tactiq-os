# The rootfs is dm-verity, read-only. augenrules --load rewrites
# /etc/audit/audit.rules whenever rules.d differs from it, and that write
# fails here. audit.rules is assembled at build time (audit_%.bbappend), so
# the rules are loaded from it directly and nothing is written.
[Service]
ExecStart=
ExecStart=@AUDITCTL@ -R /etc/audit/audit.rules

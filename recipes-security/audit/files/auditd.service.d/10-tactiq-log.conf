# The log directory is bound in from the data partition
# (var-volatile-log-audit.mount). Requires=, not Wants=: without the bind,
# auditd would write into the volatile /var/log and the record would be
# gone at the next reboot. A failed auditd is visible; a lost log is not.
[Unit]
Requires=var-volatile-log-audit.mount
After=var-volatile-log-audit.mount

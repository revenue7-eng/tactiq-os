title = "TactiQ OS gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "pki/dev private keys are public by design (see pki/README.md). EKU OID strings and kernel key fingerprints in boot logs are not secrets."
paths = ['''(^|/)pki/dev/''']
regexTarget = "line"
regexes = [
  '''X509v3ExtendedKeyUsage''',
  '''(module signing key|autogenerated kernel key): [0-9a-f]{40}''',
]

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  recipe-lint:
    name: Yocto recipe lint (oelint-adv)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install oelint-adv
        run: pip install --upgrade pip oelint-adv

      - name: Lint recipes
        run: |
          # Fail on errors; report warnings non-fatally.
          # --quiet suppresses info lines, keeps actionable output.
          set -o pipefail
          find recipes-core recipes-kernel -name '*.bb' -o -name '*.bbappend' \
            | xargs oelint-adv --quiet --fix --nofix=oelint.file.patchsignedoff \
            || echo "oelint-adv reported findings (non-fatal in CI bootstrap)"

  selinux-policy-syntax:
    name: SELinux policy syntax check
    runs-on: ubuntu-24.04
    # This job is skipped unless the companion meta-tactiq-selinux layer is
    # checked out side-by-side. The production pipeline runs a full refpolicy
    # compile via bitbake; this CI job only validates .te syntax statically.
    if: ${{ false }}
    steps:
      - uses: actions/checkout@v6

  shellcheck:
    name: Shellcheck scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'
          severity: warning

  yaml-validate:
    name: YAML + config validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install validators
        run: pip install --upgrade pip yamllint
      - name: yamllint
        run: |
          yamllint -d '{extends: relaxed, rules: {line-length: disable}}' \
            .github recipes-core 2>/dev/null || true

  distro-config-sanity:
    name: Distro config sanity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Assert security features present
        run: |
          set -e
          f=conf/distro/tactiq.conf
          grep -q 'DISTRO_FEATURES:append.*selinux' "$f" \
            || { echo "::error::selinux DISTRO_FEATURE missing"; exit 1; }
          grep -q 'DISTRO_FEATURES:append.*tpm2' "$f" \
            || { echo "::error::tpm2 DISTRO_FEATURE missing"; exit 1; }
          grep -q 'DISTRO_FEATURES:append.*seccomp' "$f" \
            || { echo "::error::seccomp DISTRO_FEATURE missing"; exit 1; }
          grep -q 'BUILD_REPRODUCIBLE_BINARIES *= *"1"' "$f" \
            || { echo "::error::reproducible builds flag missing"; exit 1; }
          grep -q 'IMAGE_CLASSES:append.*sbom-cve-check' "$f" \
            || { echo "::error::sbom-cve-check not enabled (wrynose: cve-check class removed)"; exit 1; }
          echo "distro config sanity: OK"

      - name: Assert production image profile is hardened
        run: |
          set -e
          prod=recipes-core/images/tactiq-image.bb
          dev=recipes-core/images/tactiq-image-dev.bb
          # Production recipe must exist
          test -f "$prod" \
            || { echo "::error::production image recipe missing: $prod"; exit 1; }
          # Debug-only image features (passwordless login, root login, empty
          # root password, post-install logging) are defined once as
          # TACTIQ_DEBUG_FEATURES in the dev recipe. The production recipe is
          # the base and the dev recipe requires it, so debug features are
          # absent from production by never being declared there — not by
          # being removed. A :remove in the base would be dead code and is
          # rejected below: if the base ever mentions the variable at all,
          # something has started adding it back.
          # Comments legitimately discuss both, so the checks below look at
          # code lines only.
          prod_code=$(grep -v '^[[:space:]]*#' "$prod")
          dev_code=$(grep -v '^[[:space:]]*#' "$dev")
          grep -qE 'TACTIQ_DEBUG_FEATURES[[:space:]]*=.*empty-root-password' <<<"$dev_code" \
            || { echo "::error::dev recipe does not define TACTIQ_DEBUG_FEATURES with debug features"; exit 1; }
          grep -q 'TACTIQ_DEBUG_FEATURES' <<<"$prod_code" \
            && { echo "::error::production base mentions TACTIQ_DEBUG_FEATURES; debug features must be declared in the dev recipe only"; exit 1; }
          # The dev recipe must require the production base, not the reverse.
          grep -qE '^require[[:space:]]+tactiq-image\.bb' <<<"$dev_code" \
            || { echo "::error::dev recipe does not require tactiq-image.bb; inheritance must run dev -> production"; exit 1; }
          grep -qE '^require[[:space:]]+tactiq-image-dev\.bb' <<<"$prod_code" \
            && { echo "::error::production base requires the dev recipe; inheritance is inverted"; exit 1; }
          # Production recipe must not ship an SSH server. Same reasoning: the
          # base must not declare it, rather than declare and then remove it.
          grep -q 'ssh-server-openssh' <<<"$prod_code" \
            && { echo "::error::production base declares ssh-server-openssh; the SSH server belongs to the dev recipe only"; exit 1; }
          grep -q 'IMAGE_FEATURES.*ssh-server-openssh' <<<"$dev_code" \
            || { echo "::error::dev recipe does not add ssh-server-openssh"; exit 1; }
          # Dev recipe must exist and must NOT be the build target for
          # tagged releases. (CI does not enforce that here; that gate
          # belongs to the release workflow.)
          test -f "$dev" \
            || { echo "::error::dev image recipe missing: $dev"; exit 1; }
          echo "image profile sanity: OK"

      - name: Assert kernel security fragment is wired for every kernel provider
        run: |
          set -e
          frag=recipes-kernel/linux/linux-yocto/tactiq-security.cfg
          test -f "$frag" \
            || { echo "::error::kernel security fragment missing: $frag"; exit 1; }
          # Every kernel recipe used by any tactiq machine.conf must have a
          # bbappend that pulls in tactiq-security.cfg. Today that is
          # linux-yocto; if a new kernel provider gets
          # introduced via a machine.conf, this check forces an explicit
          # decision about its hardening posture.
          providers=$(grep -h "PREFERRED_PROVIDER_virtual/kernel" conf/machine/*.conf \
                      | awk -F'"' '{print $2}' | sort -u)
          # Hardware-agnostic by design: hardening rides on the vendor-neutral
          # linux-yocto recipe via tactiq-security.cfg. Vendor kernels such as
          # linux-rockchip were dropped in the wrynose migration (258e196, no
          # base recipe in current meta-rockchip). The enumeration above covers
          # every provider actually declared in conf/machine/*.conf; re-add a
          # vendor kernel here only together with its hardening bbappend.
          for p in $providers; do
            ba=recipes-kernel/linux/${p}_%.bbappend
            test -f "$ba" \
              || { echo "::error::no bbappend for kernel provider '$p' (expected $ba)"; exit 1; }
            grep -q 'tactiq-security.cfg' "$ba" \
              || { echo "::error::$ba does not pull in tactiq-security.cfg"; exit 1; }
          done
          echo "kernel security fragment wiring: OK"
      - name: Assert RAUC keyring posture
        run: |
          set -e
          # The in-tree RAUC keyring must be the development root.
          # Production builds override RAUC_KEYRING_FILE from CI secrets.
          openssl x509 -in pki/dev/root-ca.pem -noout -subject \
            | grep -q "NOT FOR PRODUCTION" \
            || { echo "::error::pki/dev/root-ca.pem is not a development CA — production cert committed?"; exit 1; }
          # The bundle signer must chain to that root, or devices reject the bundle.
          openssl verify -CAfile pki/dev/root-ca.pem \
                         -untrusted pki/dev/signing-ca.pem \
                         pki/dev/signer.pem \
            || { echo "::error::pki/dev/signer.pem does not chain to root-ca.pem"; exit 1; }
          echo "rauc keyring posture: OK"

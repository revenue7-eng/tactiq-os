name: attest

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write      # required by actions/attest-build-provenance (Sigstore OIDC)
  attestations: write  # required to upload the attestation

jobs:
  attest-policy-source:
    name: Attest SELinux policy + layer source tarball
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build deterministic source archive
        id: archive
        run: |
          set -eu
          # git archive over the whole tracked tree, not a hand-listed subset.
          # A list silently goes stale: the previous one named four directories
          # and predated meta-tactiq-bsp-rockchip and classes-recipe, so layer
          # and class sources were outside the attested object while the
          # attestation still claimed to cover the sources. git archive has no
          # separate idea of what the tree contains, so it cannot drift.
          # Deterministic by construction: entries sorted, mtime from the commit,
          # no owner/group. gzip -n so no timestamp enters the gzip header.
          COMMIT=$(git rev-parse HEAD)
          mkdir -p dist
          git archive --format=tar --prefix="tactiq-os-${COMMIT}/" HEAD \
            | gzip -n > dist/tactiq-os-${COMMIT}.tar.gz
          sha256sum dist/tactiq-os-${COMMIT}.tar.gz | tee dist/tactiq-os-${COMMIT}.sha256
          echo "path=dist/tactiq-os-${COMMIT}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.archive.outputs.path }}

      - name: Upload source archive + checksum
        uses: actions/upload-artifact@v7
        with:
          name: tactiq-os-source
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 90

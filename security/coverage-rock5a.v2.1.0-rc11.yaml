# coverage-rock5a.v2.1.0-rc11.yaml: TactiQ OS threat-coverage manifest (PINNED)
# ---------------------------------------------------------------------------
# Generated instance for v2.1.0-rc11. Values verified against the release
# artifact set of build 20260922161055, measurements on hardware, and the
# repository tree at the tagged commit. Rows not re-examined for rc11 say so.
#
# Integration: place this file into the release artifact set BEFORE generating
# SHA256SUMS. Its sha256 lands in SHA256SUMS -> covered by the existing cosign
# workflow signature and Rekor entry. No separate signature required.
#
# Honesty rule: `covered` only with confirmed evidence. Where docs say PARTIAL
# / do not confirm -> partial/planned, tagged INFERENCE/ASSUMPTION.
#
# rc11 is the first release built with release keys and the first with a
# hardware root of measurement on the board. One row moved up (PER-0004), with
# the measurement that justifies it. rc10 was produced by copying the rc7
# instance, and several rc7 statements survived into it unchanged although the
# tree had moved on; each one corrected here is marked "correction to rc10".
# ---------------------------------------------------------------------------

schema_version: "0.2"

manifest:
  os_release: "v2.1.0-rc11"
  source_commit: "0b354fe8619a0a42e35b5c0bc2e130ff54983638"
  distro_version: "2.1.0"          # unchanged since rc6
  build_id: "20260922161055"
  platform: "Radxa Rock 5A (RK3588S)"
  toolchain: "Yocto wrynose (6.0), kernel 6.18.24+git"
  sbom:
    format: "SPDX-3.0.1"
    artifact: "sbom-rock5a.spdx.json"
  cve:
    tool: "sbom-cve-check + improve_kernel_cve_report.py; posture by scripts/cve-posture.py"
    artifact: "cve-rock5a.enriched.json"
    vulns_snapshot: "linux-vulns @ ffaa1b4ec1ea8813a90a5a6f9f577958c848a33c (committed 2026-09-21, 16838 CVE files as counted by enrich-cve.sh)"
    posture: >-
      483 image-scoped, CVSS v3 base >=7.0, status Unpatched
      (396 kernel, 87 userspace). rc10 was 267 (206 kernel, 61 userspace);
      rc7 was 274; rc6 was 134; rc5 was 35. Honest disclosure, not a patched
      count; drive-to-zero is a GA gate.
    posture_definition: >-
      Reproduce from the release alone, without a build tree, with
      `scripts/cve-posture.py <release-dir>`. Take the installed package list
      from manifest-rock5a.txt (294 packages); map each package to its recipe
      using software_packageUrl on the install-purpose software_Package
      entries in sbom-rock5a.spdx.json (the middle segment of
      pkg:yocto/<layer>/<recipe>@<version>; a Rust package described as
      pkg:cargo/<name>@<version> maps to the recipe of the same name); then
      count issues in cve-rock5a.enriched.json whose status is "Unpatched"
      and whose scorev3 is >= 7.0, keeping only recipes in that mapped set.
      294 packages map to 80 recipes with no unmapped package; two of them,
      agentgateway and tactiq-agent, map through pkg:cargo. 498 high-severity
      Unpatched entries reduce to 483 after the scope filter. Excluded as not
      installed: libxml2 (8), python3 (5), sqlite3 (2). Breakdown by detail:
      version-in-range 458, no-version-ranges 22, version-maybe-in-range 3.
      Package names and recipe names differ (libc6 -> glibc): comparing the
      two lists by string equality silently drops most of the image and is
      wrong. The raw sbom-cve-check.yocto.json gives a larger number over a
      wider scope and must not be quoted as the posture.
    method_change_since_rc10: >-
      Two changes, both found while producing this release. First, the rc10
      definition covered pkg:yocto URLs only; the two Rust packages added
      since are described as pkg:cargo, so under the old wording they were
      unmapped and their CVE records would have been left out without a
      trace. The definition now names the cargo rule, and the script prints
      which packages were mapped through it. Second, scripts/enrich-cve.sh
      located improve_kernel_cve_report.py through a path on one build
      machine, so enrichment failed on any other host; it now takes the path
      from the sourced build environment, overridable with IMPROVE. Before
      this release the posture definition existed only as prose; the script
      that implements it is added with this tag.
    regression_cause: >-
      The kernel pin did not move (6.18.24+git in rc10 and rc11). The rise
      from 267 to 483 has two causes that cannot be separated after the fact:
      the kernel CNA snapshot is eight days newer, and the raw sbom-cve-check
      pass ran with BB_NO_NETWORK against the build host's local CVE
      database, whose date was not recorded. The second is a new gap and is
      recorded as such: from the next release the date of the local database
      belongs in this field next to the snapshot commit.
    scope_limit_rust: >-
      agentgateway and tactiq-agent enter the count as recipes. Whether the
      Rust crates compiled into those two binaries are checked by
      sbom-cve-check was not established for this release, and no RustSec
      check was run. Their dependency trees are therefore outside the stated
      posture.
    triage: "SUPPLY_CHAIN.md"
  attestation:
    artifact_integrity: "SHA256SUMS"
    signature: "SHA256SUMS.workflow.{pem,sig} (cosign keyless, workflow OIDC)"
    rekor_lookup: >-
      The Rekor entry covering this release is found by searching for the
      sha256 of SHA256SUMS at https://search.sigstore.dev. No index is
      recorded in this file: it is hashed into SHA256SUMS before the entry
      exists, so a forward reference could not be verified. The index is
      pinned in the release notes after signing, per the rc5 procedure.
    slsa_provenance: "attest.yml: SLSA build-provenance over the source archive"
    slsa_scope: >-
      Correction to rc10. The rc10 instance still described the attested
      archive as four of twenty-seven top-level entries, text carried from
      rc7. At this commit attest.yml builds the archive with git archive over
      the whole tracked tree at HEAD, so the archive for this tag contains
      every tracked file, this manifest and the intentionally public pki/dev
      keys included. The entry count of the archive produced for this tag is
      not recorded here; it is measured from the attestation after the tag
      is pushed.
    boot_measurements: >-
      pcr-reference-rock5a.json: expected SHA-256 PCR values of the boot
      chain, computed by mk-pcr-reference.py from the published fitImage,
      extlinux.conf, u-boot.itb, idbloader.img and tactiq-boot.env. All
      inputs and the script are in the release set, so anyone holding the
      release can recompute the reference. mk-release.sh refuses to build the
      reference when the FIT and extlinux.conf on the boot partition of the
      .wic and of the bundle differ, and refuses a release FIT signed with
      the development key.
  reproducibility:
    status: "cross-host verified (rc7, 2026-08-05); not re-measured for rc11"
    detail: >-
      rootfs.tar.gz bit-identical across two independent cold builds on
      different CPU-generation cloud machines, sha256
      1516d31e68f84ca756c1080d492e5f06b00f90687ec30c3881a9353542d73a43.
      That measurement describes the rc7 tree. It is carried here as the last
      reproducibility result on record, not as a property of this build.
    scope_limit: >-
      What was demonstrated is determinism under fixed inputs, not fixation
      of the inputs. integration/LAYERS.lock fixes every Yocto layer by
      upstream revision and scripts/check-layers.sh --check verifies an
      assembled set against it; no release has yet carried the output of that
      run, so the layer set consumed by this build is asserted rather than
      proven.
  resolved_since_rc10:
    - "hardware root of measurement: a discrete SPI TPM 2.0 is fitted and bound in the SPL devicetree (spi@fecb0000); SPL measures the images of u-boot.itb and resets the TPM at start, so a warm reboot no longer accumulates two boot chains (verified on hardware with the development loader: identical PCR values after cold start and after warm reboot; the TPM reset lives in SPL, and idbloader.img is byte-identical in the development and release loaders, sha256 61539588e385c95362fce1469b857bfa817efa90905d6a234efba98d9d20f75b)"
    - "FIT kernel image signing: U-Boot verifies the kernel FIT against the key in its control devicetree; the release loader accepts only the release key (verified on hardware: `sha256,rsa2048:release-fit+ OK`)"
    - "production signing PKI: release build keys (FIT, IMA, module signing, RAUC) come from a release hierarchy kept offline; the release build runs with BB_NO_NETWORK; the release bundle is signed by the Release Signer and verifies against the Release Root CA"
    - "boot PCR reference published with the release and recomputable from release assets alone"
    - "CVE posture reproducible by a script shipped in the tree, and enrichment no longer bound to one machine's paths"
  deferred_in_rc11:
    - "Root CA and Signing CA private keys sit on the same offline medium as the build-time keys; moving them to a separate container, so only the build-time files travel to the build, is pending"
    - "SPL is the unmeasured root of the measurement chain and RK3588 OTP is not fused, so the BootROM does not authenticate SPL; a replaced SPL could extend the expected values. The reference describes the chain from SPL on, not from the BootROM"
    - "the final PCR values of the release chain are computed, not observed: the SPL stage of the release loader was read on hardware, the complete chain was read on hardware for the development loader only, and the production image has no console by design. Confirmation on a production device awaits a signed quote"
    - "no signed attestation envelope is produced by the device yet; a TPM quote through tactiq-agent is the next step"
    - "IMA is off in the production image (tactiq-image does not apply ima-evm-rootfs, BOOT_CHAIN.md); IMA appraisal exists only in the development image"
    - "the running rootfs is not verity-protected; dm-verity covers the update bundle only (EX-0005)"
    - "kernel pin bump: still 6.18.24+git; the layer set offers one linux-yocto version, a bump means a new openembedded-core base, a full rebuild and a fresh CVE baseline. Carried forward with its reason"
    - "date of the local CVE database used by sbom-cve-check not recorded (see cve.regression_cause); Rust crate dependencies not checked (see cve.scope_limit_rust)"
    - "no RTC on the board: a device without a time source rejects a bundle whose signer certificate is newer than the device clock; use-bundle-signing-time and min-bundle-version not set. Not re-examined for rc11"
  generated_utc: "2026-09-22T17:00:45Z"

reference_frameworks:
  - "SPARTA v3.2 (Aerospace Corp)"
  - "ESA SPACE-SHIELD"
  - "NIST 800-53 r5 (mapping indicative, verify via SPARTA Control Mapper)"


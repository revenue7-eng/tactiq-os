# ---------------------------------------------------------------------------
# rc11 summary (honest):
#   covered : none. IA-0001 is split, and only its integrity_binding half is
#             covered.
#   partial : IA-0001 (integrity binding only), EX-0009 (honest CVE),
#             EX-0010 (SELinux enforcing; no IMA in production),
#             EX-0004 (measured boot with a published reference; SPL root
#             unauthenticated, final release values not observed),
#             EX-0005 (bundle-level dm-verity only),
#             PER-0004/PER-0002 (release hierarchy, offline, no hardware token)
#   planned : DE-0007/DE-0008, DE-0010, T1611/T2017, EX-0012.13
#
# Change vs rc10. Up: PER-0004/PER-0002, on hardware evidence. Substantially
# stronger without a status change: EX-0004 (TPM fitted, measured boot,
# FIT signing, published reference). Corrected: IA-0001, EX-0010, EX-0004 and
# the manifest block carried rc7 statements the tree no longer supports.
# Down in number, not in method: the CVE posture, 267 -> 483, causes not
# separable, one of them a gap in this release's procedure.
#
# OPEN ISSUE: rekor_index self-reference:
# This file's sha256 goes into SHA256SUMS, which is what cosign signs and what
# produces the Rekor entry. The Rekor index of THIS release therefore cannot
# be known when the file is written. The index is pinned in the release notes
# after signing, per the rc5 procedure.
#
# BEFORE mk-release.sh RUNS: replace generated_utc with the actual generation
# time.

techniques:

  - id: "IA-0001"
    xref: ["T1195"]
    name: "Supply Chain Compromise (Software + Hardware)"
    tactic: "Initial Access"
    coverage: partial
    coverage_detail:
      integrity_binding: covered
      provenance_binding_binaries: planned
    mechanism: ["SBOM (SPDX 3.0.1)", "cosign keyless over SHA256SUMS", "Rekor", "SLSA provenance over the source archive (whole tracked tree)"]
    evidence:
      - { type: "sbom", ref: "sbom-rock5a.spdx.json" }
      - { type: "rekor_entry", ref: "found by sha256 of SHA256SUMS" }
      - { type: "signature", ref: "SHA256SUMS.workflow.sig" }
      - { type: "slsa_provenance", ref: "attest.yml" }
    note: >-
      Covered: artifacts cannot be altered after publication without
      detection, the publisher is the release-sign workflow on this tag, and
      the event is in a public append-only transparency log. NOT covered: any
      binding between the published binaries and commit
      0b354fe8619a0a42e35b5c0bc2e130ff54983638. The image is built on one
      offline host and SLSA provenance covers the source archive, not the
      binaries. A compromise of the build host would still yield artifacts
      that pass every consumer-side check. Correction to rc10: the rc10 note
      named the rc7 commit and the rc7 archive scope; both are replaced here,
      and the archive now spans the whole tracked tree (manifest.attestation
      .slsa_scope). Reproducibility was last measured on rc7 and is not
      claimed for this build.
    nist: ["SR-3", "SR-4", "SP 800-161", "SSDF"]
    sentinel: { signal: "sbom_runtime_drift", meaning: "runtime component != SBOM" }
    provenance: FACT

  - id: "EX-0009"
    name: "Exploit Code Flaws (OS / Known Vuln COTS-FOSS)"
    tactic: "Execution"
    coverage: partial
    mechanism: ["SBOM", "sbom-cve-check", "kernel-CVE enrichment", "VEX (pending)"]
    evidence:

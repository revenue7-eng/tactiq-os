  - id: "EX-0010"
    name: "Malicious Code (Wiper / Rootkit / Bootkit)"
    tactic: "Execution"
    coverage: partial
    mechanism: ["SELinux enforcing", "LSM: lockdown,capability,selinux,integrity"]
    evidence:
      - { type: "measurement", ref: "measurements/selinux-enforcing-boot-prod-20260717.log" }
      - { type: "doc", ref: "BOOT_CHAIN.md: IMA LOG (dev) / OFF (production)" }
    note: >-
      Correction to rc10, which listed "IMA in log mode" as a mechanism of
      this row. The production image does not apply ima-evm-rootfs: it has no
      IMA signatures and no policy on disk, so IMA contributes nothing here.
      IMA appraisal in log mode exists in the development image only. The
      SELinux side rests on the rc6 hardware measurement of the production
      image (enforcing, zero AVC denials on the boot path to the login
      prompt). It was not re-measured on the rc11 or rc12 production image,
      which has no console by design. The bootkit side depends on measured
      boot, see EX-0004. Unchanged from rc11.
    nist: ["SI-7", "SI-3"]
    sentinel: { signal: "unexpected_ima_entry", meaning: "execution outside expected IMA set" }
    provenance: FACT

  - id: "EX-0004"
    xref: ["T1542", "T2041"]
    name: "Compromise Boot Memory / Pre-OS Boot"
    tactic: "Execution / Defense Evasion"
    coverage: partial
    mechanism: ["measured boot into a discrete SPI TPM 2.0 (SPL: PCR 0, 4, 6; U-Boot: PCR 0, 1, 8, 9)", "FIT kernel image signed with the release key and verified by U-Boot", "published boot PCR reference", "RAUC A/B with U-Boot boot-count rollback"]
    evidence:
      - { type: "reference", ref: "pcr-reference-rock5a.json + inputs + mk-pcr-reference.py in the release set" }
      - { type: "doc", ref: "BOOT_CHAIN.md" }
      - { type: "measurement", ref: "release loader on hardware, cold start, U-Boot console: PCR 0, 4, 6 of the SPL stage equal the values derived from the reference events" }
      - { type: "measurement", ref: "development loader on hardware: PCR 0, 4, 6, 8 equal its computed reference after cold start and after warm reboot" }
      - { type: "measurement", ref: "release loader on hardware: `sha256,rsa2048:release-fit+ OK` on the release kernel FIT" }
    note: >-
      Correction to rc11 first. The rc11 manifest stated that SPL resets the
      TPM at start, so a warm reboot no longer accumulates two boot chains. On
      the reference platform the TPM is not reset by a warm reboot: after one,
      every PCR holds the chain extended twice, and the expected values hold
      only for a boot that follows a power cycle. This is now disclosed in
      the RIM (security/rim-disclosures-rock5a.txt). The rest of the row is
      the rc11 text, not re-measured for rc12: the loader and the FIT key are
      unchanged, the kernel was rebuilt. rc11 text: the rc10 text still
      described a board without a TPM. The board now carries a discrete SPI TPM 2.0. SPL resets it and
      measures the images of u-boot.itb (TF-A into PCR 0, U-Boot proper into
      PCR 4, the control devicetree with the FIT key into PCR 6); U-Boot adds
      the S-CRTM version and the kernel devicetree to PCR 0, the kernel
      command line to PCR 1 (one value per slot), the kernel to PCR 8 and the
      initrd marker to PCR 9. The expected values are computed from the
      release artifacts and published with them. What was observed on
      hardware: with the release loader, the SPL-stage values of PCR 0, 4
      and 6 read from the U-Boot console after a cold start; with the
      development loader, the complete chain after cold start and after warm
      reboot. What was not: the final values of the release chain, including
      PCR 1 and 8, since the production image has no console. Stays partial:
      SPL is the unmeasured root and RK3588 OTP is not fused, so the BootROM
      does not authenticate SPL, and no signed quote is produced yet
      (DE-0007/DE-0008).
    nist: ["SI-7", "SP 800-193"]
    sentinel: { signal: "boot_measurement_mismatch", meaning: "boot-chain != expected" }
    provenance: FACT

  - id: "DE-0007/DE-0008"
    name: "Evasion via Rootkit / Bootkit"
    tactic: "Defense Evasion"
    coverage: planned
    mechanism: ["(remote attestation over measured boot: quote not yet checked against the RIM)"]
    evidence:
      - { type: "reference", ref: "rim-rock5a.json + rim-rock5a.json.p7s: signed Reference Integrity Manifest, RIM Signer -> Release Signing CA -> Release Root CA (r2)" }
    note: >-
      This row is defined by its sentinel, a divergence between a TPM quote
      and an expected PCR profile. rc10 called the sentinel unreachable
      because the board had no TPM. In rc11 both halves exist separately: the
      TPM is fitted and measured (EX-0004), and the expected profile is
      published with the release. What is missing is the quote itself, a
      signed attestation envelope produced by the device through
      tactiq-agent. New in rc12: the expected values ship as a signed RIM
      that a verifier checks against the release root alone, offline. Still
      missing: an envelope from a device running this release, checked
      against this RIM. Until then the row stays planned; it moves by
      measurement, not by the presence of the parts.
    nist: ["SI-7", "CM-6"]
    sentinel: { signal: "attestation_quote_divergence", meaning: "quote != PCR profile" }
    provenance: INFERENCE

  - id: "EX-0005"
    name: "Exploit Hardware/Firmware Corruption"
    tactic: "Execution"
    coverage: partial
    mechanism: ["dm-verity over the RAUC update bundle", "CMS signature verified before mount"]
    evidence:
      - { type: "policy", ref: "tactiq_rauc.te: dedicated fs type, mount/read confined to the update domain" }
      - { type: "verification", ref: "bundle-rock5a.raucb signed by the Release Signer, verified against the Release Root CA (r2) with the image's system.conf (check-purpose=codesign-rauc); verity format; build 20260924182731" }
    note: >-
      dm-verity protects the update bundle, verified at every read, with the
      CMS signature checked before mount. The bundle is signed by the r2
      release hierarchy (manifest.release_root). The running rootfs is
      ext4 A/B and is NOT verity-protected, so rootfs_hash_mismatch is not
      detectable at runtime and IPE is not in use. Do not read this row as
      rootfs integrity. The published boot reference covers the chain up to
      the kernel and does not cover the root filesystem.
    nist: ["SI-7"]
    sentinel: { signal: "rootfs_hash_mismatch", meaning: "rootfs hash != expected" }
    provenance: INFERENCE

  - id: "PER-0004/PER-0002"
    xref: ["T2014"]
    name: "Replace Cryptographic Keys / Backdoor Installation"
    tactic: "Persistence"
    coverage: partial
    mechanism: ["release signing hierarchy (Release Root CA -> Release Signing CA -> leaf keys), CA keys in a separate container used only in a live-USB session without network", "TACTIQ_KEYRING build gate", "U-Boot FIT key check", "mk-release.sh refusal of a development-signed FIT"]
    evidence:
      - { type: "verification", ref: "bundle chain: TactiQ Release Signer -> Release Signing CA -> Release Root CA" }
      - { type: "measurement", ref: "release loader on hardware: kernel FIT accepted with release-fit" }
      - { type: "measurement", ref: "release kernel on hardware: release module signing key, Release Root CA, Release Signing CA and Release IMA Signer loaded" }
    note: >-
      rc12: the release root was regenerated (manifest.release_root). The r2
      Root CA and Signing CA were created in a live-USB session on a machine
      without network and without its internal disks in use, and their keys
      sit in a container of their own; only the build-time files travel to
      the build. The rc11 root, created on the build workstation, is retired;
      nothing it signed is trusted by an rc12 device. Still partial for the
      rc11 reasons below other than the shared medium: no hardware token, no
      fused OTP. rc11 text: moved up from planned on the measurements listed
      as evidence. Through rc10 every signature in the
      image came from the pki/dev hierarchy, whose private keys are published
      on purpose. rc11 is built with TACTIQ_KEYRING=prod from a release
      hierarchy whose keys never enter the repository: the build runs with
      the network disabled and the keys on an encrypted medium attached only
      for the build, and the bundle is re-signed with the release key after a
      temporary development signature. Why not covered (rc12): there is no
      hardware token for any key, and without fused OTP there is no secure
      boot, so a party able to write the eMMC can replace the
      loader and with it the key the loader trusts.
    nist: ["IA-5", "SC-12"]
    sentinel: { signal: "key_or_signer_change", meaning: "signer/key != pinned" }
    provenance: FACT

  - id: "DE-0010"

# coverage-rock5a.v2.1.0-rc12.yaml: TactiQ OS threat-coverage manifest (PINNED)
# ---------------------------------------------------------------------------
# Generated instance for v2.1.0-rc12. Values verified against the release
# artifact set of build 20260924182731 and the repository tree at the tagged
# commit. Rows not re-examined for rc12 say so.
#
# Integration: place this file into the release artifact set BEFORE generating
# SHA256SUMS. Its sha256 lands in SHA256SUMS -> covered by the existing cosign
# workflow signature and Rekor entry. No separate signature required.
#
# Honesty rule: `covered` only with confirmed evidence. Where docs say PARTIAL
# / do not confirm -> partial/planned, tagged INFERENCE/ASSUMPTION.
#
# rc12 is the first release under the regenerated release root (r2) and the
# first to ship a signed Reference Integrity Manifest. No row changes status:
# the RIM is the published half of remote attestation, and the row that needs
# it (DE-0007/DE-0008) moves only when an envelope from a device running this
# release has been checked against it. First schema 0.3 manifest: known issues
# carry ids from here on.
# ---------------------------------------------------------------------------

schema_version: "0.3"

manifest:
  os_release: "v2.1.0-rc12"
  source_commit: "f41aabd9ee4792c4624ae401a439f82d41f01a56"   # the commit the image was built from; the tag sits on the commit that adds this file
  distro_version: "2.1.0"          # unchanged since rc6
  build_id: "20260924182731"
  platform: "Radxa Rock 5A (RK3588S)"
  toolchain: "Yocto wrynose (6.0), kernel 6.18.24+git"
  sbom:
    format: "SPDX-3.0.1"
    artifact: "sbom-rock5a.spdx.json"
  cve:
    tool: "sbom-cve-check + improve_kernel_cve_report.py; posture by scripts/cve-posture.py"
    artifact: "cve-rock5a.enriched.json"
    vulns_snapshot: "linux-vulns @ ffaa1b4ec1ea8813a90a5a6f9f577958c848a33c (committed 2026-09-21), the same snapshot as rc11; the revision is also recorded inside cve-rock5a.enriched.json (provenance.vulns_snapshot)"
    posture: >-
      483 image-scoped, CVSS v3 base >=7.0, status Unpatched (396 kernel,
      87 userspace), the same as rc11. 293 installed packages map to 79
      recipes with no unmapped package; agentgateway and tactiq-agent map
      through pkg:cargo. One package and one recipe fewer than rc11: the
      tactiq-release package was removed, because /etc/tactiq-release is now
      written by the image class tactiq-release-identity.bbclass (#197); it
      carried no CVE records. 498 high-severity Unpatched entries reduce to
      483 after the scope filter. Excluded as not installed: libxml2 (8),
      python3 (5), sqlite3 (2). By detail: version-in-range 458,
      no-version-ranges 22, version-maybe-in-range 3. Honest disclosure, not
      a patched count; drive-to-zero is a GA gate.
    posture_definition: >-
      Unchanged from rc11. Reproduce from the release alone, without a build
      tree, with `scripts/cve-posture.py <release-dir>`: installed packages
      from manifest-rock5a.txt, mapped to recipes through software_packageUrl
      of the install-purpose software_Package entries in sbom-rock5a.spdx.json
      (pkg:yocto middle segment; pkg:cargo maps to the recipe of the same
      name), then issues in cve-rock5a.enriched.json with status "Unpatched"
      and scorev3 >= 7.0, keeping only recipes in the mapped set. The raw
      sbom-cve-check.yocto.json gives a larger number over a wider scope and
      must not be quoted as the posture.
    regression_cause: >-
      The kernel pin (6.18.24+git) and the kernel CNA snapshot (ffaa1b4) are
      both unchanged from rc11, so any difference from rc11 comes from the raw
      sbom-cve-check pass. That pass again ran with BB_NO_NETWORK against the
      build host's local CVE database, and its date is again not recorded
      (known issue cve-db-date-rust).
    scope_limit_rust: >-
      Unchanged from rc11: agentgateway and tactiq-agent enter the count as
      recipes; the Rust crates compiled into them are not checked and no
      RustSec check was run.
    triage: "SUPPLY_CHAIN.md"
  release_root:
    subject: "O = TactiQ, CN = TactiQ Release Root CA"
    generation: "r2"
    sha256_fingerprint: "8E:10:04:1E:BB:FC:CB:A0:36:62:1B:2E:45:36:87:D2:9A:50:D7:15:65:F2:99:CB:41:28:B4:CE:B9:65:FF:E8"
    not_after: "2036-09-21"
    certificate: "carried inside rim-rock5a.json (keys.release_root); a verifier pins it by the fingerprint above, obtained through a channel other than this release"
    note: >-
      Regenerated for rc12 in a live-USB session with no network, together
      with a new Signing CA and new RAUC, IMA and RIM leaves. The rc11 root
      was created on the build workstation rather than in that environment,
      and it was never published, so no verifier had pinned it. It is
      retired: an rc12 device trusts only r2, and an rc11 bundle does not
      install on it. The FIT signing key and the kernel module key are
      self-signed, outside this hierarchy, and unchanged from rc11. Confirm
      the fingerprint above through a second channel before pinning it.
  attestation:
    artifact_integrity: "SHA256SUMS"
    signature: "SHA256SUMS.workflow.{pem,sig} and SHA256SUMS.sigstore.json (cosign keyless, workflow OIDC)"
    signature_bundle: >-
      New in rc12. SHA256SUMS.sigstore.json is a Sigstore bundle holding the
      signing certificate, the signature, the Rekor inclusion proof and its
      timestamp. It lets a reader verify the signature from the release
      assets and a Sigstore trusted root after the certificate's ten-minute
      validity has ended, without querying Rekor. Offline verification of
      the bundle runs in the release workflow and does not yet fail the
      release; its result on this tag is in the workflow log.
    rekor_lookup: >-
      The Rekor entry covering this release is found by searching for the
      sha256 of SHA256SUMS at https://search.sigstore.dev. No index is
      recorded in this file: it is hashed into SHA256SUMS before the entry
      exists. The index is pinned in the release notes after signing.
    slsa_provenance: "attest.yml: SLSA build-provenance over the source archive"
    slsa_scope: >-
      Unchanged from rc11: attest.yml builds the archive with git archive
      over the whole tracked tree at HEAD.
    boot_measurements: >-
      pcr-reference-rock5a.json: expected SHA-256 PCR values of the boot
      chain, computed by mk-pcr-reference.py from the published fitImage,
      extlinux.conf, u-boot.itb, idbloader.img and tactiq-boot.env; all
      inputs and the script are in the release set.
    reference_integrity_manifest: >-
      New in rc12. rim-rock5a.json binds the expected boot values to the
      release: the PCR selection the agent quotes, the RAUC keyring and the
      IMA certificate read from the release rootfs, the platform disclosures
      of security/rim-disclosures-rock5a.txt, and the tagged commit.
      rim-rock5a.json.p7s is its CMS signature by the TactiQ OS Release RIM
      Signer, whose only extended key usage is the RIM purpose, so RAUC does
      not accept it as a bundle signer. The signature verifies to the release
      root with the Signing CA carried inside it: the verifier supplies only
      the root certificate.
  reproducibility:
    status: "cross-host verified (rc7, 2026-08-05); not re-measured for rc11 or rc12"
    detail: >-
      rootfs.tar.gz bit-identical across two independent cold builds on
      different CPU-generation cloud machines, sha256
      1516d31e68f84ca756c1080d492e5f06b00f90687ec30c3881a9353542d73a43.
      That measurement describes the rc7 tree. It is carried here as the last
      reproducibility result on record, not as a property of this build.
    scope_limit: >-
      Unchanged from rc11: determinism under fixed inputs was shown, fixation
      of the inputs was not (known issue layer-set-evidence).
  known_issues:
    previous: "v2.1.0-rc11"
    deferred:
      - id: spl-unmeasured-otp
        text: "SPL is the unmeasured root of the measurement chain and RK3588 OTP is not fused, so the BootROM does not authenticate SPL; a replaced SPL could extend the expected values. The reference describes the chain from SPL on, not from the BootROM"
      - id: pcr-computed-not-observed
        text: "the final PCR values of the release chain are computed, not observed: the complete chain was read on hardware for the development loader only, and the production image has no console by design. Not re-measured for rc12"
      - id: no-attestation-envelope
        text: "no signed attestation envelope from a device running this release has been checked against its RIM yet; the RIM is published and signed, the envelope side is the next step"
      - id: tpm-not-reset-warm-reboot
        text: "the TPM of the reference platform is not reset by a warm reboot, so the expected values hold only for a boot that follows a power cycle; correction to rc11, which stated that SPL resets the TPM (disclosed in the RIM)"
      - id: ima-off-production
        text: "IMA is off in the production image (tactiq-image does not apply ima-evm-rootfs, BOOT_CHAIN.md); IMA appraisal exists only in the development image"
      - id: rootfs-not-verity
        text: "the running rootfs is not verity-protected; dm-verity covers the update bundle only (EX-0005)"
      - id: kernel-pin
        text: "kernel pin bump: still 6.18.24+git; the layer set offers one linux-yocto version, a bump means a new openembedded-core base, a full rebuild and a fresh CVE baseline. Carried forward with its reason"
      - id: cve-db-date-rust
        text: "date of the local CVE database used by sbom-cve-check not recorded (see cve.regression_cause); Rust crate dependencies not checked (see cve.scope_limit_rust)"
      - id: no-rtc
        text: "no RTC on the board: a device without a time source rejects a bundle whose signer certificate is newer than the device clock; use-bundle-signing-time and min-bundle-version not set. Not re-examined for rc12"
      - id: layer-set-evidence
        text: "layer set verification evidence not shipped: integration/LAYERS.lock fixes every Yocto layer by upstream revision and meta-rauc by tree hash, and scripts/check-layers.sh --check verifies an assembled set against it, but no release has yet carried the output of that run, so the layer set consumed by this build is asserted rather than proven"
      - id: independent-rebuild
        text: "no third party has rebuilt a release and compared it with the published artifacts; signed artifacts cannot be rebuilt byte for byte by anyone without the keys, and no procedure yet names which unsigned artifacts a rebuild is compared on"
    resolved:
      - id: release-identity
        text: "/etc/tactiq-release is written by the image class tactiq-release-identity.bbclass and names the image and the release date (read from this build: TACTIQ_META_TACTIQ_GIT=v2.1.0-rc12, TACTIQ_IMAGE_NAME=tactiq-image, TACTIQ_RELEASE_DATE=2026-09-24); mk-release.sh refuses an image that does not name the tag"
      - id: ca-keys-same-medium
        text: "the Root CA and Signing CA keys of the r2 hierarchy were generated in a live-USB session without network and are kept in a container of their own, with its own passphrase; only the build-time files travel to the build"
  generated_utc: "2026-09-24T19:17:53Z"

reference_frameworks:
  - "SPARTA v3.2 (Aerospace Corp)"
  - "ESA SPACE-SHIELD"
  - "NIST 800-53 r5 (mapping indicative, verify via SPARTA Control Mapper)"


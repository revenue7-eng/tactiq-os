#             separated; no hardware token, no fused OTP)
#   planned : DE-0007/DE-0008 (RIM published and signed; no envelope checked),
#             DE-0010, T1611/T2017, EX-0012.13
#
# Change vs rc11. No status change. New: regenerated release root (r2) with the
# CA keys separated from the build-time keys; a signed RIM; a Sigstore bundle
# for SHA256SUMS. Corrected: the rc11 claim that SPL resets the TPM on a warm
# reboot. Known issues: 9 carried from rc11 (two reworded), 2 resolved
# (ca-keys-same-medium, release-identity), 2 new (tpm-not-reset-warm-reboot, independent-rebuild).
#

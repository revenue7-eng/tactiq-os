# OPEN ISSUE — rekor_index self-reference:
# This file's sha256 goes into SHA256SUMS, which is what cosign signs and what
# produces the Rekor entry. The Rekor index of THIS release therefore cannot be
# known when the file is written. The rc5 instance in the repository carries
# index 1911768787 in this field, which means either that value was written
# after signing (and the repository copy no longer matches the released asset),
# or it refers to a different run. Resolve before rc6 is cut: either leave the

# coverage-rock5a.v2.1.0-rc6.yaml — TactiQ OS threat-coverage manifest (PINNED)
# ---------------------------------------------------------------------------
# Generated instance for v2.1.0-rc6. Values verified against release docs,
# measurement protocols in measurements/, and the repository tree at the
# tagged commit.
#
# Integration: place this file into the release artifact set BEFORE generating
# SHA256SUMS. Its sha256 lands in SHA256SUMS -> covered by the existing cosign
# workflow signature and Rekor entry. No separate signature required.
#
# Honesty rule: `covered` only with confirmed evidence. Where docs say PARTIAL
# / do not confirm -> partial/planned, tagged INFERENCE/ASSUMPTION.
#
# FIELDS MARKED <pending> MUST BE FILLED BEFORE mk-release.sh RUNS.
# They are not knowable until the build completes. See note at end of file
# on rekor_index and the hash self-reference.
# ---------------------------------------------------------------------------

schema_version: "0.2"

manifest:
  os_release: "v2.1.0-rc6"
  source_commit: "d99725b6e7671168edf41fc29cf6c5987b08c0fc"
  distro_version: "2.1.0"            # bumped in this release; was 2.0.0 through rc5
  build_id: "20260718113035"
  platform: "Radxa Rock 5A (RK3588S)"
  toolchain: "Yocto wrynose (6.0), kernel 6.18.24+git"
  sbom:
    format: "SPDX-3.0.1"
    artifact: "sbom-rock5a.spdx.json"
  cve:
    tool: "sbom-cve-check"
    artifact: "cve-rock5a.enriched.json"
    posture: >-
      134 image-scoped, CVSS v3 base >=7.0, status Unpatched
      (108 kernel, 26 userspace). rc5 was 35 (21 kernel, 14 userspace).
      Honest disclosure, not a patched count; drive-to-zero is a GA gate.
    posture_definition: >-
      Reproduce with: take the installed package list from
      manifest-rock5a.txt, map packages to recipes with
      `oe-pkgdata-util lookup-recipe`, then count issues in
      cve-rock5a.enriched.json whose status is "Unpatched" and whose
      scorev3 >= 7.0, keeping only recipes present in that mapped set.
      273 installed packages map to 70 recipes; 141 high-severity Unpatched
      entries in the report reduce to 134 after the scope filter. Excluded
      as not installed: libxml2, python3, sqlite3. The kernel qualifies via
      kernel-base RPROVIDES. Breakdown by detail: version-in-range 110,
      no-version-ranges 24. Note that package names and recipe names differ
      (libc6 -> glibc, libselinux1 -> libselinux): comparing the two lists
      by string equality silently drops most of the image and is wrong.
      The raw sbom-cve-check.yocto.json gives a larger number over a wider
      scope and must not be quoted as the posture.
    regression_cause: >-
      The kernel pin did not move between rc5 and rc6 (6.18.24+git in both).
      85 of the 108 kernel entries are CVE-2026-*, published against that
      unchanged pin in the month since rc5 was cut. Userspace grew the same
      way (14 -> 26), mostly openssl (9) and glibc (5). Moving the pin is scheduled for
      rc7 and deliberately excluded from rc6 so that the enforcing-boot and
      OTA verification in this release are measured against an unchanged
      software base.
    triage: "SUPPLY_CHAIN.md"
  attestation:
    artifact_integrity: "SHA256SUMS"
    signature: "SHA256SUMS.workflow.{pem,sig} (cosign keyless, workflow OIDC)"
    rekor_lookup: >-
      The Rekor entry covering this release is found by searching for the
      sha256 of SHA256SUMS at https://search.sigstore.dev. No index is
      recorded in this file: it is hashed into SHA256SUMS before the entry
      exists, so a forward reference could not be verified. The index is
      pinned in the release notes after signing, per the rc5 procedure.
    slsa_provenance: "attest.yml — SLSA build-provenance over source archive"
  reproducibility:
    status: "pending re-measurement (wrynose)"   # unchanged from rc5
  resolved_since_rc5:
    - "RAUC OTA path — .raucb bundle produced and installed under enforcing"
    - "bundle now carries the production rootfs (was tactiq-image-dev until rc6)"
    - "bundle version now derives from DISTRO_VERSION (was a literal 1.0.0)"
    - "/etc/tactiq-release records the release commit (was 'unknown' through rc5)"
    - "boot partition labeled at build time (WIC rawcopy of tactiq-boot-image)"
    - "buildinfo-rock5a.json — restored by mk-release.sh"
  deferred_in_rc6:
    - "production signing PKI (RAUC keyring is a development self-signed CA)"
    - "measured boot: PCR 0-9 unmeasured, RK3588 OTP not fused"
    - "filesystem-image reproducibility re-measurement"
    - "kernel pin bump — scheduled for rc7"
    - "TACTIQ_IMAGE_NAME in /etc/tactiq-release is empty; TACTIQ_BUILD_DATE is the fixed SOURCE_DATE_EPOCH"
  generated_utc: "<iso8601>"

reference_frameworks:
  - "SPARTA v3.2 (Aerospace Corp)"
  - "ESA SPACE-SHIELD"
  - "NIST 800-53 r5 (mapping indicative — verify via SPARTA Control Mapper)"


# coverage-rock5a.TEMPLATE.yaml — TactiQ OS threat-coverage TEMPLATE (UNPINNED)
# ---------------------------------------------------------------------------
# Hand-authored template: technique -> mechanism -> sentinel signal -> NIST.
# STRUCTURE ONLY. Contains NO release-pinned values.
#
# A per-release instance (coverage-rock5a.<tag>.yaml) = this skeleton
#   + a manifest block (build_id, hashes, rekor_index, SBOM, CVE posture)
#   + per-technique: coverage status, evidence, note, provenance.
#
# Honesty rule: in an instance, `covered` only with confirmed evidence.
# This template carries NO status — it asserts no coverage, only the map.
#
# Mechanism naming rule: a mechanism is a property of the running system,
# not a build symbol and not a roadmap item. Do not name a kernel config
# option here: a compiled-in driver is a precondition, and rc5/rc6 inherited
# "TPM present (CONFIG_TCG_*)" from this file onto a board that has no TPM.
# Do not name a mechanism that is intended rather than present: this file
# named dm-verity over the rootfs and IPE, neither of which is in use.
# ---------------------------------------------------------------------------

schema_version: "0.2"

reference_frameworks:
  - "SPARTA v3.2 (Aerospace Corp)"
  - "ESA SPACE-SHIELD"
  - "NIST 800-53 r5 (mapping indicative — verify via SPARTA Control Mapper)"

# ---------------------------------------------------------------------------
# template: technique -> mechanism (intended) -> nist -> sentinel.
# coverage/evidence/note/provenance are filled in per-release instance.
# ---------------------------------------------------------------------------

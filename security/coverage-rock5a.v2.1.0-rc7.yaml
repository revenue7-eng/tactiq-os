# ---------------------------------------------------------------------------
# rc7 summary (honest):
#   covered : none. IA-0001 is split, and only its integrity_binding half is
#             covered; the rc6 summary called the whole row covered while the
#             row itself said partial, and that contradiction is removed here.
#   partial : IA-0001 (integrity binding only), EX-0009 (honest CVE),
#             EX-0010 (SELinux enforcing verified on hardware; IMA log only),
#             EX-0004 (A/B and rollback verified; no measured boot, no TPM),
#             EX-0005 (bundle-level dm-verity only)
#   planned : DE-0007/DE-0008, PER-0004/PER-0002, DE-0010, T1611/T2017,
#             EX-0012.13
#
# Change vs rc6. Up: cross-host reproducibility of the rootfs; the RAUC PKI
# unified so a bundle can be built and verified from a clean tree; a build
# gate that keeps the development root out of a production image; CVE
# enrichment reproducible from the release alone; provenance widened to the
# whole tracked tree. Down: DE-0007/DE-0008 lowered to planned; EX-0004 and
# EX-0010 no longer claim a TPM that is not on the board; the attested source
# archive was found to have covered four of twenty-seven top-level entries.
# Boot and firmware integrity did not change: no measured boot, no fused OTP,
# no production PKI, no hardware root of trust.
#
# Three rows moved down and none up, in a release that is technically stronger
# than rc6. That is the expected shape when a verification procedure is
# applied to its own artifacts, and it is the second time this procedure has
# found a claim in this project's own output that the hardware does not
# support.
#
# OPEN ISSUE - rekor_index self-reference:
# This file's sha256 goes into SHA256SUMS, which is what cosign signs and what
# produces the Rekor entry. The Rekor index of THIS release therefore cannot
# be known when the file is written. The index is pinned in the release notes
# after signing, per the rc5 procedure.
#
# BEFORE mk-release.sh RUNS: replace generated_utc with the actual generation
# time. The rc6 instance shipped with that field left as the literal
# placeholder <iso8601>.

# coverage-rock5a.v2.1.0-rc7.yaml: TactiQ OS threat-coverage manifest (PINNED)
# ---------------------------------------------------------------------------
# Generated instance for v2.1.0-rc7. Values verified against release docs,
# measurement protocols in measurements/, and the repository tree at the
# tagged commit.
#
# Integration: place this file into the release artifact set BEFORE generating
# SHA256SUMS. Its sha256 lands in SHA256SUMS -> covered by the existing cosign
# workflow signature and Rekor entry. No separate signature required.
#
# Honesty rule: `covered` only with confirmed evidence. Where docs say PARTIAL
# / do not confirm -> partial/planned, tagged INFERENCE/ASSUMPTION.
#
# Three rows moved DOWN in this release, none up. Each is recorded in place
# with the measurement that caused it. A row whose only evidence is a document
# describing intent is not `partial`.
# ---------------------------------------------------------------------------

schema_version: "0.2"

manifest:
  os_release: "v2.1.0-rc7"
  source_commit: "0dd00d07116dbd7224299706e885430be2ed6733"
  distro_version: "2.1.0"          # unchanged since rc6
  build_id: "20260805102343"
  platform: "Radxa Rock 5A (RK3588S)"
  toolchain: "Yocto wrynose (6.0), kernel 6.18.24+git"
  sbom:
    format: "SPDX-3.0.1"
    artifact: "sbom-rock5a.spdx.json"
  cve:
    tool: "sbom-cve-check + improve_kernel_cve_report.py"
    artifact: "cve-rock5a.enriched.json"
    vulns_snapshot: "linux-vulns @ 73c9131cb23dd5f3acb20d2f467ff06533e170d8 (13722 CVE records, 301 rejected)"
    posture: >-
      274 image-scoped, CVSS v3 base >=7.0, status Unpatched
      (221 kernel, 53 userspace). rc6 was 134 (108 kernel, 26 userspace);
      rc5 was 35. Honest disclosure, not a patched count; drive-to-zero is a
      GA gate.
    posture_definition: >-
      Reproduce from the release alone, without a build tree. Take the
      installed package list from manifest-rock5a.txt (273 packages); map each
      package to its recipe using software_packageUrl on the install-purpose
      software_Package entries in sbom-rock5a.spdx.json (the middle segment of
      pkg:yocto/<layer>/<recipe>@<version>); then count issues in
      cve-rock5a.enriched.json whose status is "Unpatched" and whose scorev3
      is >= 7.0, keeping only recipes in that mapped set. 273 packages map to
      68 recipes with no unmapped package; 283 high-severity Unpatched entries
      reduce to 274 after the scope filter. Excluded as not installed:
      libxml2 (2), python3 (5), sqlite3 (2). The kernel qualifies via
      kernel-base RPROVIDES. Breakdown by detail: version-in-range 251,
      no-version-ranges 23. Note that package names and recipe names differ
      (libc6 -> glibc, libselinux1 -> libselinux): comparing the two lists by
      string equality silently drops most of the image and is wrong. The raw
      sbom-cve-check.yocto.json gives a larger number over a wider scope and
      must not be quoted as the posture.
    method_change_since_rc6: >-
      rc6 mapped packages to recipes with `oe-pkgdata-util lookup-recipe` from
      a live build tree. rc7 takes the mapping from the release SBOM, so the
      posture is recomputable by anyone holding the release. This closed a
      real defect: enrich-cve.sh read the kernel compiled-sources SPDX from
      the build tree, and the rc7 build tree was a cloud instance destroyed
      after artifact retrieval, so the enrichment step was not reproducible by
      anyone, including its author. The rc7 release run had skipped enrichment
      silently, because that step warns rather than fails when the vulns
      database is absent. The data was never lost: the aggregate image SBOM
      already carries the kernel compiled-sources list. Fixed in the script,
      measured in measurements/cve-posture-rc7-20260807.md.
    regression_cause: >-
      The kernel pin did not move between rc6 and rc7 (6.18.24+git in both),
      and moving it was deferred again: the layer set offers exactly one
      linux-yocto version, so a bump requires changing the openembedded-core
      base, which would mean a full rebuild and would invalidate the
      reproducibility measurement this release rests on. The rise from 134 to
      274 has two causes that cannot be separated after the fact: CVEs
      published against an unchanged pin over three weeks, and a different
      kernel CNA snapshot. rc7 names its snapshot commit; the snapshot used
      for rc6 was never recorded, in this file or anywhere else, so the two
      numbers are not strictly like-for-like. From rc7 onward the snapshot is
      pinned in this field.
    triage: "SUPPLY_CHAIN.md"
  attestation:
    artifact_integrity: "SHA256SUMS"
    signature: "SHA256SUMS.workflow.{pem,sig} (cosign keyless, workflow OIDC)"
    rekor_lookup: >-
      The Rekor entry covering this release is found by searching for the
      sha256 of SHA256SUMS at https://search.sigstore.dev. No index is
      recorded in this file: it is hashed into SHA256SUMS before the entry
      exists, so a forward reference could not be verified. The index is
      pinned in the release notes after signing, per the rc5 procedure.
    slsa_provenance: "attest.yml - SLSA build-provenance over the source archive"
    slsa_scope_changed_in_rc7: >-
      The attested archive now covers the whole tracked tree (git archive over
      the tag, 219 entries), where rc5 and rc6 attested a hand-written list of
      four directories: conf, recipes-core, recipes-kernel, scripts. That list
      predated meta-tactiq-bsp-rockchip and classes-recipe, so the BSP layer
      and the build classes sat outside the attested object while the
      attestation was described as covering the sources: four of twenty-seven
      top-level entries were in scope, and a tampered recipe in the BSP layer
      would not have been detectable through provenance. Extending the list
      would have reproduced the defect at the next layer, so the list was
      removed rather than lengthened. Consequence for readers: provenance
      scope differs between rc7 and earlier tags and the two are not
      comparable. Two further facts, stated so they are not discovered later:
      this manifest is itself inside the attested archive (the two signatures
      are distinct, SLSA over the archive and cosign over SHA256SUMS, so this
      is not circular), and the archive contains the intentionally public
      pki/dev private keys, which are already public in git by design and are
      documented in pki/README.md. Determinism verified locally, two runs
      byte-identical; determinism under the Actions runner is a property of
      git archive, not something this release measured.
  reproducibility:
    status: "cross-host verified (rc7, 2026-08-05)"
    detail: >-
      rootfs.tar.gz bit-identical across two independent cold builds on
      different CPU-generation cloud machines, sha256
      1516d31e68f84ca756c1080d492e5f06b00f90687ec30c3881a9353542d73a43.
      Per-file 38717/38719 identical; the 2 differing entries are kernel
      build-process metadata that never enter the rootfs. Kernel image and all
      18 modules matched exactly. rc6 measured 38947/38951 between two
      consecutive builds on one host, with image bit-identity 99.9993%.
    scope_limit: >-
      What is demonstrated is determinism under fixed inputs, not fixation of
      the inputs. The seven Yocto layers used for these builds are not git
      repositories in the build environment and no set manifest (kas, .repo)
      pins them, so both builds drew the same layer snapshot from one source.
      A third party reproduces tactiq-os from the tag and does not thereby
      reproduce the layer set. This is the same failure shape as the three
      earlier defects on record (a machine-local mirror path, live upstream
      tarballs, a short-lived Fulcio certificate) and as the enrichment defect
      fixed in this release: verification depending on something live and
      external. Closing it is Phase 2 work, a self-hosted frozen source mirror
      and a pinned layer manifest.
  resolved_since_rc6:
    - "RAUC PKI unified onto pki/dev (PR #78): the image trusted a CA whose private half was in no tree and no tag, so `bitbake tactiq-bundle` from a clean clone failed with 'RAUC_KEY_FILE' not set and nobody could sign a bundle the image would accept"
    - "TACTIQ_KEYRING gate in conf/distro/tactiq.conf: a dev root cannot enter a production image mechanically, not by a sentence in a document; both branches verified"
    - "bundle build verified end to end from the unified tree: 5173 tasks, inline signature verified against the pki/dev root through the intermediate, verity format"
    - "cross-host reproducibility: rootfs.tar.gz bit-identical on two different-generation machines (rc6 measured two builds on one host)"
    - "CVE enrichment made reproducible from the release alone; the step had been skipping silently"
    - "SLSA provenance archive widened from four directories to the whole tracked tree"
  deferred_in_rc7:
    - "production signing PKI: the keyring is now a single, coherent development hierarchy with an explicit production gate, but it is still a development hierarchy with published private keys"
    - "measured boot: PCR 0-9 unmeasured, RK3588 OTP not fused, no FIT image signing"
    - "hardware root of trust: the board carries no TPM, so IMA runs without an anchor; a discrete SPI TPM 2.0 is on order"
    - "kernel pin bump: promised for rc7 in the rc6 manifest and NOT done. The layer set offers exactly one linux-yocto version, so the bump requires changing the openembedded-core base: a full rebuild, a fresh reproducibility measurement and a fresh CVE baseline. Recorded here as carried forward with its reason rather than moved quietly to rc8"
    - "layer set not pinned: the seven Yocto layers are not git repositories and no set manifest fixes them"
    - "IMA enforce mode: correct form is CONFIG_IMA_ARCH_POLICY compiled in with CONFIG_IMA_WRITE_POLICY disabled"
    - "TACTIQ_IMAGE_NAME in /etc/tactiq-release is empty; TACTIQ_BUILD_DATE is the fixed SOURCE_DATE_EPOCH"
    - "no RTC on the board: a device with no time source rejects valid bundles with 'certificate is not yet valid'; use-bundle-signing-time and min-bundle-version not yet set"
  generated_utc: "2026-08-07T00:00:00Z"

reference_frameworks:
  - "SPARTA v3.2 (Aerospace Corp)"
  - "ESA SPACE-SHIELD"
  - "NIST 800-53 r5 (mapping indicative, verify via SPARTA Control Mapper)"


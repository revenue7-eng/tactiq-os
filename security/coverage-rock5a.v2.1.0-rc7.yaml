  - id: "EX-0004"
    xref: ["T1542", "T2041"]
    name: "Compromise Boot Memory / Pre-OS Boot"
    tactic: "Execution / Defense Evasion"
    coverage: partial
    mechanism: ["IMA in log mode", "boot partition labeled at build time", "RAUC A/B with U-Boot boot-count rollback"]
    evidence:
      - { type: "doc", ref: "BOOT_CHAIN.md" }
      - { type: "measurement", ref: "measurements/rauc-rollback-test-20260716.md" }
      - { type: "measurement", ref: "measurements/rauc-pki-unify-20260806.md - install, boot to slot B, rollback via U-Boot counter" }
      - { type: "measurement", ref: "measurements/selinux-enforcing-boot-prod-20260717.log - 'ima: No TPM chip found, activating TPM-bypass!'" }
    note: >-
      Corrects an inheritance from rc5 and rc6, which listed "TPM present
      (CONFIG_TCG_*)" as a mechanism of this row. The driver is built in
      (CONFIG_TCG_TPM, CONFIG_TCG_TIS_CORE, CONFIG_TCG_TIS_SPI all =y), but
      the board carries no TPM: no node anywhere in the device tree, no TPM in
      the vendor peripheral list for any Rock 5A revision, no module directory
      because there is nothing to build, systemd compiled without TPM2
      support, and IMA announcing bypass at boot. A compiled-in driver is a
      precondition, not evidence. Measurements in this release therefore have
      no hardware anchor. Unchanged otherwise: PCR 0-9 not measured, the
      bootloader is not measured-boot-aware, RK3588 OTP fuses not burned, FIT
      image signing not enabled. New in rc7: slot switching and rollback were
      re-verified on hardware after the PKI unification. A discrete SPI TPM
      2.0 (Infineon SLB 9670) is on order; because CONFIG_TCG_TIS_SPI is
      already built in, closing this is a device-tree overlay and hardware
      bring-up rather than a kernel change.
    nist: ["SI-7", "SP 800-193"]
    sentinel: { signal: "boot_measurement_mismatch", meaning: "boot-chain != expected" }
    provenance: FACT


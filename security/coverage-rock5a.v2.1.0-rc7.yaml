  - id: "PER-0004/PER-0002"
    xref: ["T2014"]
    name: "Replace Cryptographic Keys / Backdoor Installation"
    tactic: "Persistence"
    coverage: planned
    mechanism: ["(production signing PKI - not established)", "TACTIQ_KEYRING build gate"]
    evidence:
      - { type: "measurement", ref: "measurements/rauc-pki-unify-20260806.md" }
    note: >-
      Rewritten for rc7; the rc6 text described a tree that no longer exists.
      Through rc6 the image trusted a CA (O=TactiQ Technologies, CN=TactiQ
      RAUC Dev CA) whose private half was in no tree and no tag, so
      `bitbake tactiq-bundle` from a clean clone failed and no one could sign
      a bundle the image would accept. The rc6 release notes and this row both
      stated that the CA private key was in the repository and that anyone
      could therefore mint an acceptable bundle. That was not true of rc6, and
      it became true with PR #78, which moved RAUC onto the pki/dev hierarchy
      whose private keys are published deliberately (pki/README.md: a secret
      development key would protect nothing and would make the check
      unreproducible from outside). A correction to the rc6 notes is published
      separately rather than edited in silently. The signer is now
      "O=TactiQ, CN=TactiQ OS DEVELOPMENT Signer (CI) - NOT FOR PRODUCTION".
      Status stays planned: this is a coherent development hierarchy, not a
      production one. New in rc7 and worth naming: TACTIQ_KEYRING in
      conf/distro/tactiq.conf makes it mechanically impossible for the
      development root to enter a production image, since any value other than
      `dev` without an external keyring aborts parsing. That is a gate in the
      build, not a sentence in a document. Secure boot still not established;
      a hardware-anchored PKI with an offline root remains required.
    nist: ["IA-5", "SC-12"]
    sentinel: { signal: "key_or_signer_change", meaning: "signer/key != pinned" }

    nist: ["SI-7", "CM-6"]
    sentinel: { signal: "attestation_quote_divergence", meaning: "quote != PCR profile" }
    provenance: INFERENCE

  - id: "EX-0005"
    name: "Exploit Hardware/Firmware Corruption"
    tactic: "Execution"
    coverage: partial
    mechanism: ["dm-verity over the RAUC update bundle", "CMS signature verified before mount"]
    evidence:
      - { type: "policy", ref: "tactiq_rauc.te - dedicated fs type, mount/read confined to the update domain" }
      - { type: "measurement", ref: "measurements/rauc-rollback-test-20260716.md" }
      - { type: "measurement", ref: "measurements/rauc-pki-unify-20260806.md - own bundle accepted, foreign key rejected" }
      - { type: "verification", ref: "bundle verified against the pki/dev root through the intermediate; verity format; build 20260807160929" }
    note: >-
      Unchanged in substance from rc6, and the rc6 caveat stands verbatim in
      force: dm-verity protects the squashfs *update bundle*, verified at
      every read, with the CMS signature checked before mount. The running
      rootfs is ext4 A/B and is NOT verity-protected, so rootfs_hash_mismatch
      is not detectable at runtime and IPE is not in use. Do not read this row
      as rootfs integrity. Strengthened in rc7 only in that the signature path
      is now exercised end to end rather than asserted from policy: a bundle
      built from a clean tree verifies against the development root through
      the intermediate CA, and a foreign key is rejected. That check was
      impossible before PR #78, because no signing key for the CA the image
      trusted existed in any tree.
    nist: ["SI-7"]
    sentinel: { signal: "rootfs_hash_mismatch", meaning: "rootfs hash != expected" }

# coverage-rock5a.v2.1.0-rc14.yaml: TactiQ OS threat-coverage manifest (PINNED)
# ---------------------------------------------------------------------------
# Generated instance for v2.1.0-rc14. Values verified against the release
# artifact set of build 20261012174949 and the repository tree at the tagged
# commit. Rows not re-examined for rc14 say so.
#
# Integration: place this file into the release artifact set BEFORE generating
# SHA256SUMS. Its sha256 lands in SHA256SUMS -> covered by the existing cosign
# workflow signature and Rekor entry. No separate signature required.
#
# Honesty rule: `covered` only with confirmed evidence. Where docs say PARTIAL
# / do not confirm -> partial/planned, tagged INFERENCE/ASSUMPTION.
#
# rc14 changes the base and the loader. The layer set moves to a new
# openembedded-core base, with the kernel at 6.18.52+git (from 6.18.24+git).
# U-Boot v2026.10 replaces 2024.07-kwiboo as the default loader, with fixes
# for the FIT verification and parsing issues of advisory 2026-10-08, the
# network stack removed, and the TPM platform hierarchy locked with
# TPM2_Clear disabled before the OS starts. The L3 evidence of the release is
# signed under the release root by a new Evidence Signer leaf and listed in
# SHA256SUMS. The release image and the release loader ran on the reference
# device before the tag (measurements/rel14-coldboot-20261012.md), and its
# envelopes from that run were checked against the RIM of this release before
# the tag, so DE-0007/DE-0008 moves from planned to partial.
# ---------------------------------------------------------------------------

schema_version: "0.3"

manifest:
  os_release: "v2.1.0-rc14"
  source_commit: "fd1e31d8786c2af2dbb2230a6075a59a4767073f"   # the commit the image was built from; the tag sits on or after the commit that adds this file
  distro_version: "2.1.0"          # unchanged since rc6
  build_id: "20261012174949"
  platform: "Radxa Rock 5A (RK3588S)"
  toolchain: "Yocto wrynose (6.0), kernel 6.18.52+git"
  sbom:
    format: "SPDX-3.0.1"
    artifact: "sbom-rock5a.spdx.json"
  cve:
    tool: "sbom-cve-check + improve_kernel_cve_report.py; posture by scripts/cve-posture.py"
    artifact: "cve-rock5a.enriched.json"
    vulns_snapshot: "linux-vulns @ b3dd75ace018d7588a9d02db03acd15bb68c3826 (committed 2026-10-12), new for rc14 because the kernel changed; the revision is also recorded inside cve-rock5a.enriched.json (provenance.vulns_snapshot)"
    posture: >-
      81 image-scoped, CVSS v3 base >=7.0, status Unpatched (42 kernel,
      39 userspace), down from 483 (396 kernel, 87 userspace) in rc13. 295
      installed packages map to 82 recipes with no unmapped package;
      agentgateway and tactiq-agent map through pkg:cargo. Nothing excluded as
      not installed. By detail: version-in-range 54, no-version-ranges 22,
      version-maybe-in-range 4, unpatched 1. By recipe: linux-yocto 42,
      curl 10, glibc 5, expat 4, libssh 4, busybox 3, libpcre2 2, and one each
      in acl, attr, libselinux, libsemanage, libsepol, policycoreutils,
      systemd, tpm2-tools, util-linux, util-linux-libuuid and zlib. Honest
      disclosure, not a patched count; drive-to-zero is a GA gate.
    posture_definition: >-
      Unchanged from rc11. Reproduce from the release alone, without a build
      tree, with `scripts/cve-posture.py <release-dir>`: installed packages
      from manifest-rock5a.txt, mapped to recipes through software_packageUrl
      of the install-purpose software_Package entries in sbom-rock5a.spdx.json
      (pkg:yocto middle segment; pkg:cargo maps to the recipe of the same
      name), then issues in cve-rock5a.enriched.json with status "Unpatched"
      and scorev3 >= 7.0, keeping only recipes in the mapped set. The raw
      sbom-cve-check.yocto.json gives a larger number over a wider scope and
      must not be quoted as the posture.
    regression_cause: >-
      The drop from rc13 comes from the build, not from the kernel CNA
      snapshot. Build 20261012034452, which differs from this build only in
      release-rev.inc, enriched with the rc13 snapshot (ffaa1b4, 2026-09-21)
      gave the same 81 (42 kernel, 39 userspace), recipe for recipe; this
      build enriched with the rc14 snapshot gives 81 with the same split. The
      kernel count falls with the kernel bump from 6.18.24+git to
      6.18.52+git; the userspace count falls with the recipe versions of the
      new openembedded-core base. The raw sbom-cve-check pass ran with
      BB_NO_NETWORK against the userspace databases pinned by
      openembedded-core: cvelist 9b9889cfd98306bf29b91df076c5118aae80b63f and
      NVD (fkie-cad nvd-json-data-feeds)
      82336c26ab85706ae56efaa36ef5851ab92dd32c, both committed 2026-09-11.
      Userspace issues published after that date are not counted.
    scope_limit_rust: >-
      Unchanged from rc12: agentgateway and tactiq-agent enter the count as
      recipes (tactiq-agent now vendors 45 crates, up from 11 in rc12); the Rust crates compiled into them are not checked and no
      RustSec check was run.
    triage: "SUPPLY_CHAIN.md"
  release_root:
    subject: "O = TactiQ, CN = TactiQ Release Root CA"
    generation: "r2"
    sha256_fingerprint: "8E:10:04:1E:BB:FC:CB:A0:36:62:1B:2E:45:36:87:D2:9A:50:D7:15:65:F2:99:CB:41:28:B4:CE:B9:65:FF:E8"
    not_after: "2036-09-21"
    certificate: "attached to the release as release-root-r2.pem, outside SHA256SUMS; a verifier pins it by the fingerprint above, obtained through a channel other than this release. rim-rock5a.json carries the SHA-256 of the root's public key and its subject (keys.release_root), not the certificate. Correction to rc12 and rc13, whose manifests said the certificate is carried inside the RIM"
    note: >-
      Regenerated for rc12 in a live-USB session with no network, together
      with a new Signing CA and new RAUC, IMA and RIM leaves. The rc11 root
      was created on the build workstation rather than in that environment,
      and it was never published, so no verifier had pinned it. It is
      retired: an rc12 device trusts only r2, and an rc11 bundle does not
      install on it. The FIT signing key and the kernel module key are
      self-signed, outside this hierarchy, and unchanged from rc11. Since rc14
      mk-release.sh refuses a release image whose RAUC keyring is not this
      root or whose kernel modules are not all signed by the release module
      key, pinned by its key identifier. Two leaves were added under the same
      Signing CA for rc14, each with a purpose of its own: the Evidence Signer
      (L3 evidence list) and the Cartridge Signer (Edge cartridges, not used
      by the open OS). Confirm the fingerprint above through a second channel
      before pinning it.
  attestation:
    artifact_integrity: "SHA256SUMS"
    signature: "SHA256SUMS.workflow.{pem,sig} and SHA256SUMS.sigstore.json (cosign keyless, workflow OIDC)"
    signature_bundle: >-
      Since rc12. SHA256SUMS.sigstore.json is a Sigstore bundle holding the
      signing certificate, the signature, the Rekor inclusion proof and its
      timestamp. It lets a reader verify the signature from the release
      assets and a Sigstore trusted root after the certificate's ten-minute
      validity has ended, without querying Rekor. Offline verification of
      the bundle runs in the release workflow and fails the release when it
      does not verify (release-sign.yml, fatal since v2.1.0-rc12). Correction
      to rc13, whose manifest said it did not yet fail the release.
    rekor_lookup: >-
      The Rekor entry covering this release is found by searching for the
      sha256 of SHA256SUMS at https://search.sigstore.dev. No index is
      recorded in this file: it is hashed into SHA256SUMS before the entry
      exists. The index is pinned in the release notes after signing.
    l3_evidence: >-
      New in rc14. l3-evidence-rc14.tar.gz holds the quotes and envelopes
      taken from the reference device running this release, the AK, the EK
      certificate and its issuers, and the AK registration record with its
      signature. Its own SHA256SUMS is signed by the TactiQ OS Release Evidence
      Signer (SHA256SUMS.p7s), a leaf whose only extended key usage is the
      evidence purpose, so the list verifies to the release root offline. The
      archive, VERIFY-L3-rc14.md and verify-l3-rc14.sh are listed in this
      release's SHA256SUMS (RELEASE_INTEGRITY.md 5.9).
    slsa_provenance: "attest.yml: SLSA build-provenance over the source archive"
    slsa_scope: >-
      Unchanged from rc11: attest.yml builds the archive with git archive
      over the whole tracked tree at HEAD.
    boot_measurements: >-
      pcr-reference-rock5a.json: expected SHA-256 PCR values of the boot
      chain on the bootm path the rc14 loader takes (boot_ab from the
      environment compiled into u-boot.itb, one FIT configuration per slot,
      each slot's command line in /chosen of its devicetree), computed by
      mk-pcr-reference.py from the published fitImage and u-boot.itb, with
      idbloader.img checked for the same U-Boot version. The inputs and the
      script are in the release set. extlinux.conf and tactiq-boot.env are
      published as found but take no part in this boot: the loader refuses
      sysboot and a stored bootargs.
    reference_integrity_manifest: >-
      Since rc12. rim-rock5a.json binds the expected boot values to the
      release: the PCR selection the agent quotes, the RAUC keyring and the
      IMA certificate read from the release rootfs, the platform disclosures
      of security/rim-disclosures-rock5a.txt, and the tagged commit.
      rim-rock5a.json.p7s is its CMS signature by the TactiQ OS Release RIM
      Signer, whose only extended key usage is the RIM purpose, so RAUC does
      not accept it as a bundle signer. The signature verifies to the release
      root with the Signing CA carried inside it: the verifier supplies only
      the root certificate.
  reproducibility:
    status: "cross-host verified (rc7, 2026-08-05); not re-measured for rc11, rc12, rc13 or rc14"
    detail: >-
      rootfs.tar.gz bit-identical across two independent cold builds on
      different CPU-generation cloud machines, sha256
      1516d31e68f84ca756c1080d492e5f06b00f90687ec30c3881a9353542d73a43.
      That measurement describes the rc7 tree. It is carried here as the last
      reproducibility result on record, not as a property of this build.
    scope_limit: >-
      Determinism under fixed inputs was shown on rc7. From rc14 the release
      carries check-layers-rc14.txt, the output of
      `scripts/check-layers.sh --check` over the layer directory the build
      used: every layer of integration/LAYERS.lock at its pinned commit with
      a clean working tree, and the meta-rauc tree hash verified. It was run
      on the build host after the build, so it shows the set as it stood
      then; it is not a hermetic build.
  known_issues:
    previous: "v2.1.0-rc13"
    deferred:
      - id: spl-unmeasured-otp
        text: "SPL is the unmeasured root of the measurement chain and RK3588 OTP is not fused, so the BootROM does not authenticate SPL; a replaced SPL could extend the expected values. The reference describes the chain from SPL on, not from the BootROM"
      - id: pcr-computed-not-observed
        text: "the PCR values of slot A are computed, not observed. For slot B the release image and loader produced, after a power cycle, 19 quotes whose PCR 0 to 9 digest equals the slot B composite of this RIM (VERIFY-L3-rc14.md); slot A has not booted the release image. rc14 measures the kernel devicetree into PCR 1, so the two slots differ there. Values after a warm reboot with the release loader have not been observed, and the production image has no console by design"
      - id: tpm-reset-line
        text: "SPL pulses the TPM reset line before measuring, so a warm reboot starts the TPM like a power cycle; observed with the development loader on a warm reboot, and with the rc14 release loader at a cold start (measurements/rel14-coldboot-20261012.md). A warm reboot with the release loader has not been observed. The line is a GPIO the running system can also drive, so a TPM reset is not by itself evidence of a reboot (disclosed in the RIM; replaces tpm-not-reset-warm-reboot)"
      - id: ima-off-production
        text: "IMA is off in the production image (tactiq-image does not apply ima-evm-rootfs, BOOT_CHAIN.md). IMA appraisal and IMA measurement, including the rule that measures reads of Edge cartridges (tactiq_cartridge_t) into PCR 11, exist only in the development image; in this release cartridge reads are not measured"
      - id: agent-quote-pcr-0-9
        text: "tactiq-agent quotes PCR 0 to 9 only (TACTIQ_PCR_SPEC, the selection of the RIM) and its envelope carries no IMA log, so runtime measurements in PCR 10 and above are not part of the evidence the agent produces. Quotes over PCR 10 to 12 in the measurement records were taken by hand with tpm2_quote, not by the agent"
      - id: rootfs-not-verity
        text: "the image is built for dm-verity on the FIT path: rootfs_a is written from the .ext4.verity artefact and the root hash is carried in the signed slot device tree (#217). Booting the root through verity was observed on the reference device with the development image and with the release image of this build, root hash as built (measurements/rel14-coldboot-20261012.md); the refusal of a modified root block has not been recorded"
      - id: cve-db-date-rust
        text: "Rust crate dependencies not checked (see cve.scope_limit_rust). The date of the userspace CVE databases is now recorded (cve.regression_cause): they are the revisions pinned by openembedded-core, committed 2026-09-11, so userspace issues published after that date are not counted"
      - id: no-rtc
        text: "no RTC on the board. rc14 sets a clock floor at the release date and version limits from release-rev.inc (#237); on the development image a signed bundle installed without setting the clock, and a bundle with a lower version was refused before any slot was touched. Still open: a bundle whose signer certificate is newer than the clock floor"
      - id: independent-rebuild
        text: "no third party has rebuilt a release and compared it with the published artifacts; signed artifacts cannot be rebuilt byte for byte by anyone without the keys, and no procedure yet names which unsigned artifacts a rebuild is compared on"
      - id: agent-evidence-unbounded
        text: "tactiq-attest b853253 adds an epoch counter and a bounded audit directory (DDR-006, #233), and this release pins the agent at a later attest revision; the bound over the device's service life is not yet stated in ATTESTATION.md"
      - id: ak-registration-bench-only
        text: "AK registration against the EK certificate (DDR-005) exists for the reference device only, made by TactiQ. For rc14 the record is format 2, signed by the Registration Signer leaf, with the CRLs of the EK chain it was checked against; the record and its signature are in the L3 evidence. A release device has no registration path of its own"
      - id: attestation-docs-stale
        text: "ATTESTATION.md still describes a verifier-initiated mTLS protocol with Ed25519 keys that is not implemented, and THREAT_MODEL.md still names the agent a stub; the implemented agent writes signed envelope files under a restricted ECDSA P-256 AK"
      - id: tpm-owner-auth-empty
        text: "the owner, endorsement and lockout authorizations of the reference TPM are empty, so a root process can evict the persistent AK (0x81010100) and take the device out of attestation until it is registered again; it cannot make another AK pass, because the registration record names the AK. From rc14 the bootloader disables the platform hierarchy and sets disableClear, so root can no longer clear the TPM or use platform authority (observed on the reference device, 2026-10-08)"
      - id: ima-tmpfs-unappraised
        text: "the IMA policy does not appraise files on tmpfs, so root can mount a tmpfs and run an unsigned binary from it; observed on the development image on 2026-10-08, where the Infineon TPM update tool ran from a tmpfs because /data is mounted noexec"
      - id: agent-envelope-not-atomic
        text: "the agent writes the files of an envelope in place, without fsync or an atomic rename, so the envelope being written when power is lost can be left as files of zero length. On the reference device the envelope after the last one in the L3 evidence was left that way when power was removed at the end of the run; it carries no evidence and is not in the archive. The audit log shows the envelopes in it, not that none are missing (VERIFY-L3-rc14.md)"
      - id: netperm-dev-permission
        text: "on the reference device the release image refused the site network permission left in /data by development work, and the agent ran without network (measurements/rel14-coldboot-20261012.md). The permission is signed with the development netperm key and the release image pins the release key (TACTIQ_NETPERM_PUBKEY), so the refusal is the intended behaviour. A permission signed with the release key has not been tested on this release"
    resolved:
      - id: no-attestation-envelope
        text: "the agent of this release ran on the reference device after a power cycle (measurements/rel14-coldboot-20261012.md); 19 of its envelopes, signed by the AK registered against the EK (ak-registration-bench-only), verify against the RIM of this release, slot B, by the published procedure, before the tag (l3-evidence-rc14.tar.gz, VERIFY-L3-rc14.md)"
      - id: kernel-pin
        text: "the rc14 layer set moves to a new openembedded-core base and the kernel to 6.18.52+git, with a fresh CVE baseline (manifest.cve)"
      - id: layer-set-evidence
        text: "the release carries check-layers-rc14.txt, the output of scripts/check-layers.sh --check over the layer directory the build used: every layer of integration/LAYERS.lock at its pinned commit with a clean tree, and the meta-rauc tree hash verified. Run on the build host after the build (reproducibility.scope_limit)"
      - id: tpm-not-reset-warm-reboot
        text: "withdrawn as wrong: the development loader resets the TPM on a warm reboot (measurements/tpm-quotes-dev-20261002.md, #224, rc13 errata section 1); replaced by tpm-reset-line"
      - id: agent-skip-switch-unseen
        text: "the runtime skip switch is removed: the agent unit no longer reads /etc/tactiq/skip-tpm, and autostart on QEMU is disabled at build time (#231)"
  generated_utc: "2026-10-13T06:11:18Z"

reference_frameworks:
  - "SPARTA v3.2 (Aerospace Corp)"
  - "ESA SPACE-SHIELD"
  - "NIST 800-53 r5 (mapping indicative, verify via SPARTA Control Mapper)"

# ---------------------------------------------------------------------------
# coverage: covered | partial | planned
# ---------------------------------------------------------------------------
techniques:

  - id: "IA-0001"
    xref: ["T1195"]
    name: "Supply Chain Compromise (Software + Hardware)"
    tactic: "Initial Access"
    coverage: partial
    coverage_detail:
      integrity_binding: covered
      provenance_binding_binaries: planned
    mechanism: ["SBOM (SPDX 3.0.1)", "cosign keyless over SHA256SUMS", "Rekor", "SLSA provenance over the source archive (whole tracked tree)"]
    evidence:
      - { type: "sbom", ref: "sbom-rock5a.spdx.json" }
      - { type: "rekor_entry", ref: "found by sha256 of SHA256SUMS" }
      - { type: "signature", ref: "SHA256SUMS.workflow.sig, SHA256SUMS.sigstore.json" }
      - { type: "slsa_provenance", ref: "attest.yml" }
    note: >-
      Covered: artifacts cannot be altered after publication without
      detection, the publisher is the release-sign workflow on this tag, and
      the event is in a public append-only transparency log. Since rc12 the
      signature also ships as a Sigstore bundle (SHA256SUMS.sigstore.json)
      carrying the certificate, the transparency-log inclusion proof and its
      timestamp, so it verifies from the release assets after the ten-minute
      certificate has expired. NOT covered: any binding between the published
      binaries and commit fd1e31d8786c2af2dbb2230a6075a59a4767073f. The image
      is built on one offline host and SLSA provenance covers the source
      archive, not the binaries. A compromise of the build host would still
      yield artifacts that pass every consumer-side check. Reproducibility was
      last measured on rc7 and is not claimed for this build.
    nist: ["SR-3", "SR-4", "SP 800-161", "SSDF"]
    sentinel: { signal: "sbom_runtime_drift", meaning: "runtime component != SBOM" }
    provenance: FACT

  - id: "EX-0009"
    name: "Exploit Code Flaws (OS / Known Vuln COTS-FOSS)"
    tactic: "Execution"
    coverage: partial
    mechanism: ["SBOM", "sbom-cve-check", "kernel-CVE enrichment", "VEX (pending)"]
    evidence:
      - { type: "cve_scan", ref: "cve-rock5a.enriched.json" }
      - { type: "tool", ref: "scripts/cve-posture.py" }
      - { type: "triage", ref: "SUPPLY_CHAIN.md" }
    note: >-
      81 image-scoped high-severity Unpatched (42 kernel, 39 userspace), down
      from 483 in rc13 through the kernel bump and the new recipe versions;
      the kernel CNA snapshot does not change the count
      (manifest.cve.regression_cause). Userspace is counted against databases
      pinned at 2026-09-11. The two Rust packages are counted as recipes;
      their crate dependencies are not (manifest.cve.scope_limit_rust). VEX
      still pending. CVE->0 is a GA gate, not an rc.
    nist: ["SR-3", "RA-5"]
    sentinel: { signal: "known_vuln_component_present", meaning: "SBOM component with open CVE is active" }
    provenance: FACT

  - id: "EX-0010"
    name: "Malicious Code (Wiper / Rootkit / Bootkit)"
    tactic: "Execution"
    coverage: partial
    mechanism: ["SELinux enforcing", "LSM: lockdown,capability,selinux,integrity"]
    evidence:
      - { type: "measurement", ref: "measurements/selinux-enforcing-boot-prod-20260717.log" }
      - { type: "measurement", ref: "measurements/rel14-coldboot-20261012.md: rc14 production image, enforcing, no AVC denial in the journal of the boot" }
      - { type: "doc", ref: "BOOT_CHAIN.md: IMA LOG (dev) / OFF (production)" }
    note: >-
      Correction to rc10, which listed "IMA in log mode" as a mechanism of
      this row. The production image does not apply ima-evm-rootfs: it has no
      IMA signatures and no policy on disk, so IMA contributes nothing here.
      IMA appraisal in log mode exists in the development image only. The
      SELinux side rests on the rc6 hardware measurement of the production
      image (enforcing, zero AVC denials on the boot path to the login
      prompt) and, for rc14, on a cold start of the production image on the
      reference device: the kernel log over UART shows the switch to
      enforcing, and the journal of that boot, read from the data partition
      exported after the run, has no AVC denial
      (measurements/rel14-coldboot-20261012.md). The rc11, rc12 and rc13
      production images were not re-measured; the production image has no
      console by design. The bootkit side depends on measured boot, see
      EX-0004.
    nist: ["SI-7", "SI-3"]
    sentinel: { signal: "unexpected_ima_entry", meaning: "execution outside expected IMA set" }
    provenance: FACT

  - id: "EX-0004"
    xref: ["T1542", "T2041"]
    name: "Compromise Boot Memory / Pre-OS Boot"
    tactic: "Execution / Defense Evasion"
    coverage: partial
    mechanism: ["measured boot into a discrete SPI TPM 2.0 (SPL: PCR 0, 4, 6; U-Boot v2026.10: PCR 0, 1, 8, 9)", "FIT kernel image signed with the release key and verified by U-Boot", "published boot PCR reference", "RAUC A/B with U-Boot boot-count rollback"]
    evidence:
      - { type: "reference", ref: "pcr-reference-rock5a.json + inputs + mk-pcr-reference.py in the release set" }
      - { type: "doc", ref: "BOOT_CHAIN.md" }
      - { type: "measurement", ref: "development loader, U-Boot v2026.10, on hardware: event log placement of the kernel devicetree in PCR 1 (2026-10-08)" }
      - { type: "measurement", ref: "rc14 release loader on the reference device, cold start: SPL TPM reset and measurement of the u-boot.itb images, FIT accepted with release-fit, TPM platform hierarchy disabled (measurements/rel14-coldboot-20261012.md)" }
      - { type: "verification", ref: "rc14 release loader, build host: fit_check_sign with the release control devicetree accepts the release kernel FIT (sha256,rsa2048:release-fit+) and refuses a development FIT (required signature key-release-fit)" }
    note: >-
      rc14 replaces the loader: U-Boot v2026.10 is the default, with
      2024.07-kwiboo kept one release as a fallback. It carries the fixes of
      advisory 2026-10-08 for FIT verification and parsing, has no network
      stack, and locks the TPM platform hierarchy with TPM2_Clear disabled
      before the OS starts. v2026.10 measures the kernel devicetree into
      PCR 1 rather than PCR 0; mk-pcr-reference.py models both and refuses a
      U-Boot version whose placement it does not know. The rc14 release
      loader ran on the reference device before the tag: SPL pulsed the TPM
      reset line and measured the images of u-boot.itb, and U-Boot accepted
      the kernel FIT with release-fit and disabled the TPM platform hierarchy
      (measurements/rel14-coldboot-20261012.md). PCR values were not read in
      that run; the quotes the agent took in it match the slot B values of
      this release's RIM (DE-0007/DE-0008). On the build host the loader accepts only a FIT signed with
      release-fit. Correction to rc13: this row said that the TPM is not
      reset by a warm reboot. That was withdrawn in the rc13 errata (known
      issue tpm-reset-line): SPL pulses the TPM reset line, observed with the
      development loader on a warm reboot and with the rc14 release loader at
      a cold start. SPL measures the images of
      u-boot.itb (TF-A into PCR 0, U-Boot proper into PCR 4, the control
      devicetree with the FIT key into PCR 6); U-Boot adds the S-CRTM version
      to PCR 0, the kernel devicetree and command line to PCR 1, the kernel to
      PCR 8 and the initrd marker to PCR 9. The expected values are computed
      from the release artifacts and published with them. Stays partial: SPL
      is the unmeasured root and RK3588 OTP is not fused, so the BootROM does
      not authenticate SPL, and the slot A values have not been observed.
    nist: ["SI-7", "SP 800-193"]
    sentinel: { signal: "boot_measurement_mismatch", meaning: "boot-chain != expected" }
    provenance: FACT

  - id: "DE-0007/DE-0008"
    name: "Evasion via Rootkit / Bootkit"
    tactic: "Defense Evasion"
    coverage: partial
    mechanism: ["TPM quote over PCR 0 to 9 under a registered AK, checked against the signed RIM of the release"]
    evidence:
      - { type: "reference", ref: "rim-rock5a.json + rim-rock5a.json.p7s: signed Reference Integrity Manifest, RIM Signer -> Release Signing CA -> Release Root CA (r2)" }
    note: >-
      This row is defined by its sentinel, a divergence between a TPM quote
      and an expected PCR profile. rc10 called the sentinel unreachable
      because the board had no TPM. In rc11 both halves exist separately: the
      TPM is fitted and measured (EX-0004), and the expected profile is
      published with the release. What is missing is the quote itself, a
      signed attestation envelope produced by the device through
      tactiq-agent. Since rc12 the expected values ship as a signed RIM
      that a verifier checks against the release root alone, offline. New in
      rc13: the agent in the image is real and starts at boot (prover 0.3.0,
      envelope v2: TPM2_Quote under a restricted AK). rc14 puts the L3
      evidence inside the signed set (manifest.attestation.l3_evidence), and
      the envelopes of this release, taken from the reference device after a
      power cycle, verify against this RIM before the tag: 19 quotes, slot B
      (VERIFY-L3-rc14.md). The row moves to partial by that measurement.
      Stays partial: the AK was registered by TactiQ on its own bench and a
      release device has no registration path of its own
      (ak-registration-bench-only); the quotes are not fresh, their
      qualifying data is the agent's own record; slot A has not been observed
      (pcr-computed-not-observed); the agent's log does not show that no
      envelope is missing (agent-envelope-not-atomic).
    nist: ["SI-7", "CM-6"]
    sentinel: { signal: "attestation_quote_divergence", meaning: "quote != PCR profile" }
    provenance: INFERENCE

  - id: "EX-0005"
    name: "Exploit Hardware/Firmware Corruption"
    tactic: "Execution"
    coverage: partial
    mechanism: ["dm-verity over the RAUC update bundle", "CMS signature verified before mount"]
    evidence:

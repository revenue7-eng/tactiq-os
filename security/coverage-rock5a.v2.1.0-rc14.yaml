      - { type: "verification", ref: "bundle-rock5a.raucb of build 20261012174949, re-signed by scripts/resign-bundle.sh: verifies against the Release Root CA (r2) with the image's system.conf (check-purpose=codesign-rauc) and is refused against the development root; verity format" }
      - { type: "measurement", ref: "rc14 release image on the reference device: root mounted through dm-verity with the root hash of build 20261012174949 (measurements/rel14-coldboot-20261012.md)" }
    note: >-
      dm-verity protects the update bundle, verified at every read, with the
      CMS signature checked before mount. The bundle is signed by the r2
      release hierarchy (manifest.release_root). Correction to rc13, which
      said the running rootfs is not verity-protected: the image is built for
      dm-verity on the FIT path, rootfs_a is written from the .ext4.verity
      artefact and the root hash is carried in the signed slot device tree.
      Booting through verity was observed with the development image and
      with the release image of this build, and the refusal of a modified
      root block has not been recorded (known issue rootfs-not-verity), so
      rootfs_hash_mismatch is not claimed as detected. IPE is not in use. The
      published boot reference covers the chain up to the kernel and does
      not cover the root filesystem.
    nist: ["SI-7"]
    sentinel: { signal: "rootfs_hash_mismatch", meaning: "rootfs hash != expected" }
    provenance: INFERENCE

  - id: "PER-0004/PER-0002"
    xref: ["T2014"]
    name: "Replace Cryptographic Keys / Backdoor Installation"
    tactic: "Persistence"
    coverage: partial
    mechanism: ["release signing hierarchy (Release Root CA -> Release Signing CA -> leaf keys), CA keys in a separate container used only in a live-USB session without network", "TACTIQ_KEYRING build gate", "U-Boot FIT key check", "mk-release.sh refusal of a development-signed FIT", "mk-release.sh pins of the RAUC keyring, the RIM root and the module signing key (since rc14)"]
    evidence:
      - { type: "verification", ref: "bundle chain: TactiQ Release Signer -> Release Signing CA -> Release Root CA" }
      - { type: "measurement", ref: "release loader on hardware: kernel FIT accepted with release-fit (rc11; rc14, measurements/rel14-coldboot-20261012.md)" }
      - { type: "measurement", ref: "release kernel on hardware (rc11, and rc14 in measurements/rel14-coldboot-20261012.md): release module signing key, Release Root CA, Release Signing CA and Release IMA Signer loaded, no development certificate" }
      - { type: "verification", ref: "rc14 build host: kernel modules signed by the release module key (modinfo sig_key 66:2F:3A:D2:...:2C:DE:DA), checked for every module by mk-release.sh; the module key file is part of the kernel configure task hash" }
    note: >-
      rc14: the release pipeline checks keys against pinned values instead of
      refusing one known development key, the bundle re-sign is a script
      with a two-sided check, and the module signing key enters the kernel
      task hash by content, so a different key under the same path rebuilds
      the kernel. Two purpose leaves were added offline (key log KL-012).
      rc12: the release root was regenerated (manifest.release_root). The r2
      Root CA and Signing CA were created in a live-USB session on a machine
      without network and without its internal disks in use, and their keys
      sit in a container of their own; only the build-time files travel to
      the build. The rc11 root, created on the build workstation, is retired;
      nothing it signed is trusted by an rc12 device. Still partial for the
      rc11 reasons below other than the shared medium: no hardware token, no
      fused OTP. rc11 text: moved up from planned on the measurements listed
      as evidence. Through rc10 every signature in the
      image came from the pki/dev hierarchy, whose private keys are published
      on purpose. rc11 is built with TACTIQ_KEYRING=prod from a release
      hierarchy whose keys never enter the repository: the build runs with
      the network disabled and the keys on an encrypted medium attached only
      for the build, and the bundle is re-signed with the release key after a
      temporary development signature. Why not covered (rc14, unchanged from rc12): there is no
      hardware token for any key, and without fused OTP there is no secure
      boot, so a party able to write the eMMC can replace the
      loader and with it the key the loader trusts.
    nist: ["IA-5", "SC-12"]
    sentinel: { signal: "key_or_signer_change", meaning: "signer/key != pinned" }
    provenance: FACT


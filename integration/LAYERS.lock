# TactiQ OS layer lock — build input state of release v2.1.0-rc6
#
# Records the exact upstream revision of every Yocto layer that produced
# the v2.1.0-rc6 release artifacts. Together with scripts/setup-layers.sh
# this makes the build input fully specified from public sources: an
# independent party can reconstruct the complete layer set without access
# to the original build host.
#
# Provenance note. The dependency-layer revisions below were recovered
# forensically from the original build host after the release: per-file
# blob hashes of each layer directory were matched against upstream
# history (content match, file modes excluded — the layers had passed
# through an NTFS filesystem, which does not preserve POSIX modes).
# Eight of nine layers matched their pinned commit exactly, file for
# file; openembedded-core matched exactly once oe-core's own
# `.gitignore` pattern `buildtools/` was accounted for (it hides five
# tracked files from a fresh index). The tactiq-os-selinux revision is
# established from the build host reflog (HEAD at build time); a clean
# working tree at build time is asserted, not proven. From v2.1.0-rc7
# onward this file is maintained at build time, not reconstructed.
#
# Format: <layer> <remote> <commit> <upstream-branch>
# meta-rauc is not listed: it is reconstructed deterministically by
# scripts/setup-meta-rauc.sh (pinned commit + local patch, verified by
# tree hash ce25181e3275664e5ed66d980ef2e74424861801).


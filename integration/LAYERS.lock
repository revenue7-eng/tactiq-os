# TactiQ OS layer lock: the layer set the build on this commit consumes
#
# Records the exact upstream revision of every Yocto layer. Together with
# scripts/setup-layers.sh this makes the build input fully specified from
# public sources: an independent party can reconstruct the complete layer
# set without access to the original build host.
#
# A release is built from the lock at its tag. The release gate is
# scripts/check-layers.sh --check, run against the assembled tree before
# the build; its output ships with the release. Releases up to and
# including v2.1.0-rc13 did not ship that output (coverage manifest known
# issue layer-set-evidence), so for them the lock at the tag records the
# layer set the build is believed to have consumed, not one proven against
# the tree.
#
# The repository carrying this file is not listed. It is identified by
# the tag the verifier checked out; a line pinning it here could not be
# written before the commit containing that line exists. setup-layers.sh
# places that checkout into the layer set directly.
#
# History. The lock at the v2.1.0-rc6 tag was recovered forensically after
# the release, from a build tree that carried no git metadata. v2.1.0-rc7
# was built on a cloud host destroyed after artifact retrieval, before
# scripts/check-layers.sh was tracked; its coverage manifest records the
# layer set as unpinned.
#
# Format: <layer> <remote> <commit> <upstream-branch>
# meta-rauc is not listed: it is reconstructed deterministically by
# scripts/setup-meta-rauc.sh (pinned upstream commit plus a local patch
# carried in this repository, verified by tree hash
# ce25181e3275664e5ed66d980ef2e74424861801).
#
# meta-tensorflow-lite has no wrynose branch. Its main moved to blacksail
# only (9e0d503); the pin is the last commit whose LAYERSERIES_COMPAT
# includes wrynose.

